class TextControl extends Control {
    constructor(x,y,w,h,text,color){
        super(x,y,w,h)
        
        if(typeof text == 'string')
            this.text = [text]
        else
            this.text = text
        this.color = color
    }
    setText(text){
        if(typeof text == 'string')
            this.text = [text]
        else
            this.text = text
    }
    draw(ctx,mouseCoordsTransformed){
        ctx.strokeStyle = this.color
        ctx.lineWidth = 2
        
        var theight = this.h / (this.text.length + (this.text.length-1) / 3)
        var hpause = theight / 3
        
        for(var i in this.text){
            var row = this.text[i]
            
            var twidth = this.w / (row.length + (row.length-1) / 3)
            var wpause = twidth / 3
            for(var j in row){
                var letter = row[j]

                var coords = vectorLetters[letter]
                                
                if(coords != undefined){
                    coords = typeof coords[0][0] == 'object' ? coords : [coords]

                    for(var l in coords){
                        var coords_elem = coords[l]
                        ctx.beginPath()
                        for(var k in coords_elem){
                            var point = coords_elem[k]
                            if(k == 0){
                                ctx.moveTo(this.x + point[0]*twidth + j*(twidth+wpause), this.y + point[1]*theight + i*(theight+hpause))
                            } else {
                                ctx.lineTo(this.x + point[0]*twidth + j*(twidth+wpause), this.y + point[1]*theight + i*(theight+hpause))
                            }
                        }
                        ctx.stroke()
                    }
                }
            }
        }
        ctx.lineWidth = 1
    }
}
class OptionControl extends Control {
    constructor(x,y,w,h,color,borderColor,options,storageKey){
        super(x,y,w,h)
        
        this.color = color
        this.borderColor = borderColor
        
        this.textControl = new TextControl(x+30,y,w-30*2,h,options[0],borderColor)

        let t = this
        this.arrowLeft = new ArrowButton(x,y,20,h,false,color,borderColor,() => {t.changeOption(false)})
        this.arrowRight = new ArrowButton(x+w-20,y,20,h,true,color,borderColor,() => {t.changeOption(true)})
        
        this.options = options
        this.currentOptionIndex = 0
        
        this.storageKey = storageKey
        
        this.loadStorageItem()
    }
    loadStorageItem(){
        var existing = window.localStorage.getItem(this.storageKey)
        if(existing == null){
            this.setStorageItem()
        } else {
            this.currentOptionIndex = existing
        }
    }
    setStorageItem(){
        window.localStorage.setItem(this.storageKey,this.currentOptionIndex)
    }
    getCurrentOption(){
        return this.options[this.currentOptionIndex]
    }
    changeOption(right){
        if(right){
            this.currentOptionIndex++
            if(this.currentOptionIndex >= this.options.length)
                this.currentOptionIndex = 0
        } else {
            this.currentOptionIndex--
            if(this.currentOptionIndex < 0)
                this.currentOptionIndex = this.options.length-1
        }
        this.setStorageItem()
    }
    draw(ctx,mouseCoordsTransformed){
        ctx.strokeStyle = this.color
        ctx.lineWidth = 2
        
        this.textControl.setText(this.options[this.currentOptionIndex])
        
        this.textControl.draw(ctx,mouseCoordsTransformed)
        this.arrowLeft.draw(ctx,mouseCoordsTransformed)
        this.arrowRight.draw(ctx,mouseCoordsTransformed)
        
        ctx.lineWidth = 1
    }
    tryClick(mouseCoordsTransformed){
        if(this.focus(mouseCoordsTransformed)){
            this.arrowLeft.tryClick(mouseCoordsTransformed)
            this.arrowRight.tryClick(mouseCoordsTransformed)
        }
    }
}
class Button extends Control {
    constructor(x,y,w,h,text,color,borderColor,func){
        super(x,y,w,h)
        this.text = text
        this.color = color
        this.borderColor = borderColor
        this.func = func
        this.textControl = new TextControl(x+h*0.2,y+h*0.2,w-h*0.4,h-h*0.4,text,borderColor)
        this.disabled = false
    }
    setDisabled(disabled){
        this.disabled = disabled
    }
    setColors(borderColor, color){
        this.borderColor = borderColor
        this.color = color
        
        this.textControl.color = borderColor
    }
    draw(ctx,mouseCoordsTransformed){
        ctx.strokeStyle = this.borderColor
        ctx.fillStyle = this.color
        
        ctx.fillRect(this.x,this.y,this.w,this.h)
        if(!this.disabled && this.focus(mouseCoordsTransformed)){
            ctx.fillStyle = '#ffffff88'
            ctx.fillRect(this.x,this.y,this.w,this.h)
        }
        
        ctx.lineWidth = 2
        this.textControl.draw(ctx,mouseCoordsTransformed)
        ctx.lineWidth = 1
        if(this.disabled){
            ctx.fillStyle = '#88888888'
            ctx.fillRect(this.x,this.y,this.w,this.h)
        }
        ctx.strokeRect(this.x,this.y,this.w,this.h)
    }
    tryClick(mouseCoordsTransformed){
        if(!this.disabled && this.focus(mouseCoordsTransformed)){
            return this.func()
        }
    }
}
class ArrowButton extends Control {
    constructor(x,y,w,h,right,color,borderColor,func){
        super(x,y,w,h)
        this.color = color
        this.borderColor = borderColor
        this.func = func
        this.right = right
    }
    draw(ctx,mouseCoordsTransformed){
        ctx.strokeStyle = this.borderColor
        ctx.fillStyle = this.color
        
        ctx.beginPath()
        if(this.right){
            ctx.moveTo(this.x+this.w,this.y+this.h/2)
            ctx.lineTo(this.x,this.y)
            ctx.lineTo(this.x,this.y+this.h)
        } else {
            ctx.moveTo(this.x,this.y+this.h/2)
            ctx.lineTo(this.x+this.w,this.y)
            ctx.lineTo(this.x+this.w,this.y+this.h)
        }
        ctx.closePath()
        
        ctx.fill()
        if(this.focus(mouseCoordsTransformed)){
            ctx.fillStyle = '#ffffff88'
            ctx.fill()
        }
        ctx.stroke()
        
        ctx.lineWidth = 2
        ctx.lineWidth = 1
    }
    tryClick(mouseCoordsTransformed){
        if(this.focus(mouseCoordsTransformed)){
            return this.func()
        }
    }
}
class DiplomacyIncomingRequestControl extends Control {
    constructor(x,y,w,h,color,borderColor,model,state){
        super(x,y,w,h)
        this.color = color
        this.borderColor = borderColor
        this.model = model
        this.state = state
        
        this.textControl = new TextControl(x+15,y+15,w-30,30,'REQUEST',borderColor)
        
        let t = this
        this.acceptButton = new Button(x+15,y+65,w-30,40,'ACCEPT','#00000033','#000000bb',()=>{t.accept()})
        this.rejectButton = new Button(x+25,y+115,w-50,40,'REJECT','#00000033','#000000bb',()=>{t.reject()})
    }
    accept(){
        var model = this.model instanceof Function ? this.model() : this.model
        
        var diplomacyQueue = model.diplomacyQueue.filter(a => a.to == model.playerChoosen)
        
        var currentRequest = diplomacyQueue[0]
        
        model.acceptDiplomacyQueueRequest(currentRequest,true)
    }
    reject(){
        var model = this.model instanceof Function ? this.model() : this.model
        
        var diplomacyQueue = model.diplomacyQueue.filter(a => a.to == model.playerChoosen)
        
        var currentRequest = diplomacyQueue[0]
        
        model.acceptDiplomacyQueueRequest(currentRequest,false)
    }
    draw(ctx,mouseCoordsTransformed){
        var model = this.model instanceof Function ? this.model() : this.model
        
        var diplomacyQueue = model.diplomacyQueue.filter(a => a.to == model.playerChoosen)
        
        var currentRequest = diplomacyQueue[0]
        
        var color = currentRequest.from.color        
        var dark = darkColor(color)
        var borderColor = dark ? '#fffa' : '#000'
        var shadeColor = dark ? '#fff2' : '#0002'
        
        ctx.strokeStyle = borderColor
        ctx.fillStyle = color
        
        ctx.lineWidth = 2
        ctx.strokeRect(this.x,this.y,this.w,this.h)
        ctx.fillRect(this.x,this.y,this.w,this.h)
        ctx.lineWidth = 1
        
        this.textControl.setText([currentRequest.type.toUpperCase(), 'REQUEST'])
        this.textControl.color = borderColor
        this.textControl.draw(ctx,mouseCoordsTransformed)
        
        
        this.acceptButton.setColors(borderColor, shadeColor)
        this.acceptButton.draw(ctx,mouseCoordsTransformed)
        this.rejectButton.setColors(borderColor, shadeColor)
        this.rejectButton.draw(ctx,mouseCoordsTransformed)
    }
    tryClick(mouseCoordsTransformed){
        this.acceptButton.tryClick(mouseCoordsTransformed)
        this.rejectButton.tryClick(mouseCoordsTransformed)
    }
}
class DiplomacyRequestControl extends Control {
    constructor(x,y,w,h,color,borderColor,model,state){
        super(x,y,w,h)
        this.color = color
        this.borderColor = borderColor
        this.model = model
        this.state = state
    
        this.textControl = new TextControl(x+15,y+15,w-30,30,'DIPLOMACY',borderColor)
        
        let t = this
        this.truceButton = new Button(x+15,y+65,w-30,40,'TRUCE','#00000033','#000000bb',()=>{t.tryAskTruce()})
        this.vassalizeButton = new Button(x+15,y+115,w-30,40,'VASSALIZE','#00000033','#000000bb',()=>{t.model.askToVassalize(t.model.playerChoosen,t.state.chosenTeam);t.state.chosenTeam = null;t.state.highlightedTeam = null})
        this.becomeVassalButton = new Button(x+15,y+165,w-30,40,'BECOME VASSAL','#00000033','#000000bb',()=>{t.model.askForVassalization(t.model.playerChoosen,t.state.chosenTeam);t.state.chosenTeam = null;t.state.highlightedTeam = null})
        
        this.cancelButton = new Button(x+25,y+h-50,w-50,40,'CANCEL','#00000033','#000000bb',()=>{t.state.chosenTeam = null;t.state.highlightedTeam = null})
    }
    tryAskTruce(){
        if(this.model.inQueue(this.model.diplomacyRelations,this.model.playerChoosen,this.state.chosenTeam,'truce')){
            this.model.breakTruce(this.model.playerChoosen,this.state.chosenTeam)
        } else {
            this.model.askTruce(this.model.playerChoosen,this.state.chosenTeam)
        }
        this.state.chosenTeam = null
        this.state.highlightedTeam = null
    }
    draw(ctx,mouseCoordsTransformed){
        var model = this.model instanceof Function ? this.model() : this.model
        
        var diplomacyQueue = model.diplomacyQueue.filter(a => a.from == model.playerChoosen)
        var diplomacyRelations = model.diplomacyRelations.filter(a => a.from == model.playerChoosen)
        
        var truceData = diplomacyRelations.filter(a => a.to == this.state.chosenTeam)
        if(truceData.length > 0){
            if(truceData[0].time > 0){
                this.truceButton.textControl.setText('TRUCE ['+Math.floor(truceData[0].time/10)+']')
                this.truceButton.setDisabled(true)
            } else {
                this.truceButton.textControl.setText('BREAK TRUCE')
                this.truceButton.setDisabled(false)
            }
        } else if(diplomacyQueue.filter(a => a.to == this.state.chosenTeam).length > 0){
            this.truceButton.textControl.setText('WAITING...')
            this.truceButton.setDisabled(true)
        } else {
            this.truceButton.textControl.setText('TRUCE')
            this.truceButton.setDisabled(false)
        }
        
        
        var color = this.state.chosenTeam?.color ?? this.color        
        var dark = darkColor(color)
        var borderColor = dark ? '#fffa' : '#000'
        var shadeColor = dark ? '#fff2' : '#0002'
        
        ctx.strokeStyle = borderColor
        ctx.fillStyle = color
        
        ctx.lineWidth = 2
        ctx.strokeRect(this.x,this.y,this.w,this.h)
        ctx.fillRect(this.x,this.y,this.w,this.h)
        ctx.lineWidth = 1
        
        this.textControl.color = borderColor
        this.textControl.draw(ctx,mouseCoordsTransformed)
        
        this.truceButton.setColors(borderColor, shadeColor)
        this.truceButton.draw(ctx,mouseCoordsTransformed)
        this.vassalizeButton.setColors(borderColor, shadeColor)
        this.vassalizeButton.draw(ctx,mouseCoordsTransformed)
        this.becomeVassalButton.setColors(borderColor, shadeColor)
        this.becomeVassalButton.draw(ctx,mouseCoordsTransformed)
        
        this.cancelButton.setColors(borderColor, shadeColor)
        this.cancelButton.draw(ctx,mouseCoordsTransformed)
    }
    tryClick(mouseCoordsTransformed){
        this.truceButton.tryClick(mouseCoordsTransformed)
        this.vassalizeButton.tryClick(mouseCoordsTransformed)
        this.becomeVassalButton.tryClick(mouseCoordsTransformed)
        
        this.cancelButton.tryClick(mouseCoordsTransformed)
    }
}
class StatisticsPanel extends Control {
    constructor(x,y,w,h,color,borderColor,model,state){
        super(x,y,w,h)
        this.color = color
        this.borderColor = borderColor
        this.model = model
        this.state = state
        
        var diplomacyRequestControlPadding = 20
        this.diplomacyRequestControl = new DiplomacyRequestControl(x+diplomacyRequestControlPadding,y+diplomacyRequestControlPadding,w-diplomacyRequestControlPadding*2,h-diplomacyRequestControlPadding*2,this.color,this.borderColor,this.model,this.state)
        this.diplomacyIncomingRequestControl= new DiplomacyIncomingRequestControl(x+diplomacyRequestControlPadding,y+diplomacyRequestControlPadding,w-diplomacyRequestControlPadding*2,250-diplomacyRequestControlPadding*2,this.color,this.borderColor,this.model,this.state)
        //this.func = func
        //this.textControl = new TextControl(x+h*0.2,y+h*0.2,w-h*0.4,h-h*0.4,text,borderColor)
    }
    statDimensionsByGroupedVoronois(model){
        var result = []
        var row = 0
        var column = 0
        
        const COLUMNS = 2
        const ROWS = 20
        
        for(var i in model.groupedMergedVoronois){
            var teamStat = model.groupedMergedVoronois[i]
            
            var height = teamStat.voronois.length
            if(teamStat.voronois.length > 1)
                height++
            if(teamStat.embarkedCount > 0)
                height++
            if(row+height>ROWS){
                column++
                row = 0
                if(column == COLUMNS)
                    break
            }
            
            var w = this.w / COLUMNS
            var h = this.h / ROWS
            
            result.push({
                teamStat:teamStat,
                column:column,
                row:row,
                height:height,
                w:w,
                h:h
            })
            
            row += height
        }
        return result
    }
    getHighlightedPanelTeam(mouseCoordsTransformed){
        var model = this.model
        var sdbgvs = this.statDimensionsByGroupedVoronois(model)
        for(var i in sdbgvs){
            var sdbgv = sdbgvs[i]
            var teamStat = sdbgv.teamStat
            
            var height = sdbgv.height
            var row = sdbgv.row
            var column = sdbgv.column
            
            var w = sdbgv.w
            var h = sdbgv.h
            
            if(
                mouseCoordsTransformed != null && 
                mouseCoordsTransformed.x > this.x + w * column && 
                mouseCoordsTransformed.x < this.x + w * column + w && 
                mouseCoordsTransformed.y > this.y + h * row &&
                mouseCoordsTransformed.y < this.y + h * row + h*height
                )
                return teamStat.team
            
        }
        return null
    }
    draw(ctx,mouseCoordsTransformed){
        ctx.strokeStyle = this.borderColor
        ctx.fillStyle = this.color
        
        var model = this.model instanceof Function ? this.model() : this.model
        
//        ctx.fillRect(this.x,this.y,this.w,this.h)
        ctx.strokeRect(this.x,this.y,this.w,this.h)
        
//        ctx.lineWidth = 2
//        this.textControl.draw(ctx,mouseCoordsTransformed)
//        ctx.lineWidth = 1
        const BORDER_PADDING = 1
        const PADDING = 4
        const LEFT_MARGIN = 15
        const PADDING_SMALL = 6
        
        var sdbgvs = this.statDimensionsByGroupedVoronois(model)
        var diplomacyQueue = model.diplomacyQueue.filter(a => a.from == model.playerChoosen)
        var diplomacyRelations = model.diplomacyRelations.filter(a => a.from == model.playerChoosen)
        
        for(var i in sdbgvs){
            var sdbgv = sdbgvs[i]
            var teamStat = sdbgv.teamStat
            
            var height = sdbgv.height
            var row = sdbgv.row
            var column = sdbgv.column
            
            var left_margin = LEFT_MARGIN * (column+1)
            
            var w = sdbgv.w - LEFT_MARGIN
            var h = sdbgv.h

            var dark = darkColor(teamStat.team.color)
            var border = dark ? '#ffffffcc' : '#000000cc'
            var padding = BORDER_PADDING
            
            ctx.strokeStyle = border
            
            var borderColor = this.borderColor
            if(teamStat.team == model.playerChoosen){
                padding = BORDER_PADDING*2
                borderColor = dark ? '#ff0' : '#a60'
                ctx.strokeStyle = borderColor
            }
            var fill = teamStat.team.color
            
            ctx.fillStyle = borderColor
            ctx.fillRect(this.x + left_margin + w * column,this.y + h * row,w,h*height)
            if(this.state.highlightedTeam == teamStat.team){
                ctx.fillStyle = '#ffff00'
                ctx.fillRect(this.x + left_margin + w * column,this.y + h * row,w,h*height)
                ctx.fillStyle = fill
            }
            if(this.state.chosenTeam == teamStat.team){
                ctx.lineWidth = 2
                ctx.fillStyle = '#ffff00'
                ctx.fillRect(this.x + left_margin + w * column,this.y + h * row,w,h*height)
                ctx.fillStyle = fill
                padding = BORDER_PADDING*2
            }
            
            ctx.fillStyle = fill
            ctx.fillRect(this.x + left_margin + w * column+padding,this.y + h * row+padding,w-padding*2,h*height-padding*2)
            
            
            var totalRealArea = model.wholeRealLandArea(teamStat)
            this.drawNumber(ctx,teamStat.unitCount,this.x + left_margin + w * column + PADDING, this.y + h * row  + PADDING, w*2/5 - PADDING * 2, h - PADDING * 2, 4)
            this.drawSlash(ctx,this.x + left_margin + w*2/5 + w * column + PADDING, this.y + h * row  + PADDING, w/5 - PADDING * 2, h - PADDING * 2)
            this.drawNumber(ctx,totalRealArea,this.x + left_margin + w*3/5 + w * column + PADDING, this.y + h * row  + PADDING, w*2/5 - PADDING * 2, h - PADDING * 2, 4)
            if(teamStat.voronois.length > 1){
                var tsv = teamStat.voronois.sort((a,b)=>(b.landArea-a.landArea))
                for(var i in tsv){
                    
                    var voronoi = tsv[i]
                    
                    var realArea = model.realLandArea(voronoi,teamStat)
                    

                    this.drawNumber(ctx,voronoi.unitCount,this.x + left_margin + w * column + PADDING_SMALL, this.y + h * (row + 1 + Number(i))  + PADDING_SMALL, w*2/5 - PADDING_SMALL * 2, h - PADDING_SMALL * 2, 4)
                    this.drawSlash(ctx,this.x + left_margin + w*2/5 + w * column + PADDING_SMALL, this.y + h * (row + 1 + Number(i))  + PADDING_SMALL, w/5 - PADDING_SMALL * 2, h - PADDING_SMALL * 2)
                    this.drawNumber(ctx,realArea,this.x + left_margin + w*3/5 + w * column + PADDING_SMALL, this.y + h * (row + 1 + Number(i))  + PADDING_SMALL, w*2/5 - PADDING_SMALL * 2, h - PADDING_SMALL * 2, 4)
                }
            }
            if(teamStat.embarkedCount > 0){
                this.drawNumber(ctx,teamStat.embarkedCount,this.x + left_margin + w * column + PADDING_SMALL, this.y + h * (row + height - 1)  + PADDING_SMALL, w*2/5 - PADDING_SMALL * 2, h - PADDING_SMALL * 2, 4)
            }

            
            
            
            ctx.fillStyle = '#fff'
            if(diplomacyQueue.filter(a => a.to == teamStat.team && a.type == 'truce').length > 0){
                ctx.strokeStyle = '#aaa'
                drawPacifistSymbol(ctx,this.x + LEFT_MARGIN/2 + left_margin-LEFT_MARGIN + w * column,this.y + h/2 + h * row,'?')
            }
            
            if(diplomacyRelations.filter(a => a.to == teamStat.team && a.type == 'truce').length > 0){
                ctx.strokeStyle = '#111'
                drawPacifistSymbol(ctx,this.x + LEFT_MARGIN/2 + left_margin-LEFT_MARGIN + w * column,this.y + h/2 + h * row,'?')
            }
            
            ctx.strokeStyle = border
            
            row += height
            ctx.lineWidth = 1

        }
        
        if(this.state.chosenTeam){
            this.diplomacyRequestControl.draw(ctx,mouseCoordsTransformed)
        } else if(model.diplomacyQueue.filter(a => a.to == model.playerChoosen).length > 0){
            var currentRequest = model.diplomacyQueue.filter(a => a.to == model.playerChoosen)[0]
            
            this.diplomacyIncomingRequestControl.draw(ctx,mouseCoordsTransformed)
        }
    }
    /*
        this.groupedMergedVoronois.push({
        team:team,
        voronois:magv,
        unitCount:this.units.filter(a => a.team == team).map(a=>a.size).reduce((a,b) => a+b,0),
        area:magv.map(a=>a.landArea).reduce((a,b) => a+b,0),
        embarkedCount:this.units.filter(a => a.team == team && a.embarked).map(a=>a.size).reduce((a,b) => a+b,0)
    */
    drawNumber(ctx,num,x,y,w,h,digits){
        var strnum = String(Math.floor(num))
        var twidth = w / (digits + (digits-1) / (3))
        var wpause = twidth / (digits-1)

        if(strnum.length <= digits){
            for(var i = 0;i<strnum.length;i++){
                var digit = strnum[i]
                var pos = i + digits - strnum.length
                this.drawDigit(ctx,digit,x + pos * (twidth+wpause),y,twidth,h)
            }
        } else {
            
        }
    }
    drawDigit(ctx,num,x,y,w,h){
        var coords = vectorNumbers[num]
        ctx.beginPath()
        for(var i in coords){
            var point = coords[i]
            if(i == 0){
                ctx.moveTo(x+point[0]*w,y+point[1]*h)
            } else {
                ctx.lineTo(x+point[0]*w,y+point[1]*h)
            }
        }
        ctx.stroke()
    }
    drawSlash(ctx,x,y,w,h){
        ctx.beginPath()
        ctx.moveTo(x+w,y)
        ctx.lineTo(x  ,y+h)
        ctx.stroke()
    }
    tryClick(mouseCoordsTransformed){
//        if(this.focus(mouseCoordsTransformed)){
//            return this.func()
//        }
        var model = this.model instanceof Function ? this.model() : this.model

        if(this.state.gameplay){
            if(this.state.chosenTeam != null){
                this.diplomacyRequestControl.tryClick(mouseCoordsTransformed)
            } else if(model.diplomacyQueue.filter(a => a.to == model.playerChoosen).length > 0){
                this.diplomacyIncomingRequestControl.tryClick(mouseCoordsTransformed)
            } else {
                if(this.getHighlightedPanelTeam(mouseCoordsTransformed) != null){
                    if(this.state.highlightedTeam != null && this.state.gameplay) {
                        this.state.chosenTeam = this.state.chosenTeam == this.state.highlightedTeam || this.state.highlightedTeam == model.playerChoosen
                            ? null
                            : this.state.highlightedTeam
                    } else {
                        this.state.chosenTeam = null
                    }
                }
            }
        }
    }
}
function drawPacifistSymbol(ctx,x,y,text,scale){
    if(scale == undefined)
        scale = 1
    const r = 7*scale
    ctx.beginPath()
    ctx.moveTo(x+r*(0),y+r*(1))
    ctx.lineTo(x+r*(-0.7),y+r*(0.7))
    ctx.lineTo(x+r*(-1),y+r*(0))
    ctx.lineTo(x+r*(-0.7),y+r*(-0.7))
    ctx.lineTo(x+r*(0),y+r*(-1))
    ctx.lineTo(x+r*(0.7),y+r*(-0.7))
    ctx.lineTo(x+r*(1),y+r*(0))

}

    checkDiplomacy(mergedGraph){
        var model = this.model()
        
//        console.log(model.diplomacyQueue,model.diplomacyRelations)
        
        var teamsInPlay = Array.from(new Set(model.units.map(unit => unit.team)))
        
        var borderingTeams = this.borderingTeams(model,mergedGraph)

        var teamsByColor = {}
        for(var i in teamsInPlay){
            var team = teamsInPlay[i]
            teamsByColor[team.color] = team
        }
//        console.log(borderingTeams)
        var goodBorderings = {}
        for(var teamColor in borderingTeams){
            goodBorderings[teamColor] = []
        }
        
            
        var goodScores = {}
        var strategicPositions = this.strategicPositions(model,mergedGraph)
        for(var teamColor in borderingTeams){
            var team = teamsByColor[teamColor]
            
            if(team == undefined)
                continue
                
            if(!(teamColor in this.goodTruceRequestProspects))
                this.goodTruceRequestProspects[teamColor] = {}
            

            var teamScore = this.strategicPositionEvaluationForTeam(strategicPositions,mergedGraph,team)
            for(var i in borderingTeams[teamColor]){
                var borderingTeam = borderingTeams[teamColor][i]
                
                var withTestedRelation = this.strategicPositions(model,mergedGraph,[{type:'truce',from:team,to:borderingTeam},{type:'truce',from:borderingTeam,to:team}])
                
                var teamScore2 = this.strategicPositionEvaluationForTeam(withTestedRelation,mergedGraph,team)
                if(teamScore < teamScore2){
                    if(!(teamColor in goodScores))
                        goodScores[teamColor] = {}
                    goodScores[teamColor][borderingTeam.color] = true
                    if(!(borderingTeam.color in this.goodTruceRequestProspects[teamColor]))
                        this.goodTruceRequestProspects[teamColor][borderingTeam.color] = 1
                    else
                        this.goodTruceRequestProspects[teamColor][borderingTeam.color]++
                }
            }
            
            for(var color2 in this.goodTruceRequestProspects[teamColor]){
                if(!(teamColor in goodScores) || !(color2 in goodScores[teamColor]) || !goodScores[teamColor][color2]){
                    delete this.goodTruceRequestProspects[teamColor][color2]
                }
            }
        }
        
        this.strategicPositionsDebug = {strategicPositions:strategicPositions,mergedGraph:mergedGraph}
        
        //dummy for testing
        for(var i in model.diplomacyQueue){
            var request = model.diplomacyQueue[i]

            if(request != undefined)
                if(request.to != model.playerChoosen){
                    var accept = request.to.color in goodScores && request.from.color in goodScores[request.to.color] && goodScores[request.to.color][request.from.color]
                    model.acceptDiplomacyQueueRequest(request,accept)
                }
        }
        for(var colorFrom in this.goodTruceRequestProspects){
            if(colorFrom == model.playerChoosen.color)
                continue
                
            var prospects = this.goodTruceRequestProspects[colorFrom]
            for(var colorTo in prospects){
                if(prospects[colorTo] >= 3 && colorFrom in teamsByColor && colorTo in teamsByColor){
                    model.askTruce(teamsByColor[colorFrom], teamsByColor[colorTo])
                }
            }
        }
        console.log(model.diplomacyRelations)
        for(var i in model.diplomacyRelations){
            var relation = model.diplomacyRelations[i]

            if(relation != undefined) //bez sensu
                if(relation.type == 'truce' && relation.time <= 0){
                    if(relation.from != model.playerChoosen){
                        if(!(relation.from.color in goodScores) || !(relation.to.color in goodScores[relation.from.color]))
                            model.breakTruce(relation.from,relation.to)
                    }
                }
        }
    }
    strategicPositionEvaluationForTeam(strategicPositions,mergedGraph,team){
        var score = 0
        for(var code in strategicPositions){
            var vertex = mergedGraph[code]
            
            var vertexTeam = vertex.unit ? vertex.unit.team : vertex.town.team

            if(vertexTeam == team){
                score += strategicPositions[code]
            }
        }
        return score
    }
    borderingTeams(model,mergedGraph){
        var codes = Object.keys(mergedGraph)
                
        var borderingTeams = {}
        
        for(var codeIndex in codes){
            var code = codes[codeIndex]
            var vertex = mergedGraph[code]
            
            var vertexTeam = vertex.unit ? vertex.unit.team : vertex.town.team
                
            var oneMoved = false
            var unit = vertex.town ? vertex.town.occupyingUnit : vertex.unit
                    
            var unitRemained = null
            var paths = vertex.paths
            
            if(vertexTeam != null){
                borderingTeams[vertexTeam.color] = []

                if(vertex.distanceToEnemyLevel == 0){
                    for(var i in paths){
                        var path = paths[i]
                        var target = mergedGraph[path.targetCode]
                        
                        var targetTeam = target.unit ? target.unit.team : target.town.team
                        
                        if(targetTeam != null && targetTeam != vertexTeam){
                            borderingTeams[vertexTeam.color].push(targetTeam)
                        }
                    }
                    
                }
            }
        }
        
        return borderingTeams
    }
    strategicPositions(model,mergedGraph,testedRelations){
        
        var codes = Object.keys(mergedGraph)
        
        var truceGraph = relationColorGraph('truce',model,testedRelations)
        
        var valuePerCode = {}
        var diffValuePerCode = {}
        var realDistanceToEnemy = {}
        
        for(var codeIndex in codes){
            var code = codes[codeIndex]
            var vertex = mergedGraph[code]
            
            var oneMoved = false
            var unit = vertex.town ? vertex.town.occupyingUnit : vertex.unit
            if(unit != null){
                valuePerCode[code] = unit.size
            } else {
                valuePerCode[code] = 0
            }
            diffValuePerCode[code] = 0
            realDistanceToEnemy[code] = vertex.distanceToEnemyLevel
        }
        
        var maxDistanceToEnemy = Object.values(mergedGraph).map(a=>a.distanceToEnemyLevel).filter(a => a != Infinity).reduce((a,b) => Math.max(a,b),0)
        
        if(testedRelations != null){
            var removedTeams = {}
            var removedVertices = []
            for(var i in testedRelations){
                var relation = testedRelations[i]
                
                removedTeams[relation.from.color] = true
            }
            for(var codeIndex in codes){
                var code = codes[codeIndex]
                var vertex = mergedGraph[code]
                
                var vertexTeam = vertex.unit ? vertex.unit.team : vertex.town.team
                
                if(vertexTeam != null && removedTeams[vertexTeam.color]){
                    realDistanceToEnemy[code] = Infinity
                    removedVertices.push(code)
                }
            }
            
            var removedVerticesCopy = removedVertices.slice()

            for(var repeat = 0;repeat < 8;repeat++){
                var newRemovedVerticesCopy = []
                for(var i in removedVerticesCopy){
                    var code = removedVerticesCopy[i]
                    
                    var vertex = mergedGraph[code]
                    
                    var vertexTeam = vertex.unit ? vertex.unit.team : vertex.town.team

                    var oneMoved = false
                    
                    var unit = vertex.town ? vertex.town.occupyingUnit : vertex.unit
                            
                    var unitRemained = null
                    var paths = vertex.paths
                    
                    var updated = false
                    for(var i in paths){
                        var pathObject = paths[i]
                        
                        var neighboringVertex = mergedGraph[pathObject.targetCode]
                        var neighborTeam = neighboringVertex.unit ? neighboringVertex.unit.team : neighboringVertex.town.team

                        if(neighborTeam != vertexTeam && (neighborTeam == null || !inTruceGraph(truceGraph,vertexTeam,neighborTeam))){
                            realDistanceToEnemy[code] = 0
                            updated = true
                        } else if(neighborTeam == vertexTeam && realDistanceToEnemy[code] > realDistanceToEnemy[pathObject.targetCode] + 1){
                            realDistanceToEnemy[code] = realDistanceToEnemy[pathObject.targetCode] + 1
                            updated = true
                        }
                    }
                    
                    if(!updated)
                        newRemovedVerticesCopy.push(code)
                }
                removedVerticesCopy = newRemovedVerticesCopy
            }
        }
        
        
        for(var repeat = maxDistanceToEnemy;repeat >= 1;repeat--){
            for(var codeIndex in codes){
                var code = codes[codeIndex]
                var vertex = mergedGraph[code]
                
                var vertexTeam = vertex.unit ? vertex.unit.team : vertex.town.team

                var oneMoved = false
                
                var unit = vertex.town ? vertex.town.occupyingUnit : vertex.unit
                        
                var unitRemained = null
                var paths = vertex.paths
                

                var targetCodesToSend = []
                for(var i in paths){
                    var path = paths[i]
                    
                    if(realDistanceToEnemy[code] == repeat){
                        var target = mergedGraph[path.targetCode]

                        var targetTeam = target.unit ? target.unit.team : target.town.team
                        
                        if(targetTeam == vertexTeam && realDistanceToEnemy[path.targetCode] == repeat-1){
                            targetCodesToSend.push(path.targetCode)
                        }
                    }
                    
                }
                for(var i in targetCodesToSend){
                    var targetCode = targetCodesToSend[i]
                    
                    valuePerCode[targetCode] += valuePerCode[code] / targetCodesToSend.length
                }
                if(realDistanceToEnemy[code] == repeat && repeat > 0)
                    valuePerCode[code] = 0
            }
        }
        
        
        for(var codeIndex in codes){
            var code = codes[codeIndex]
            var vertex = mergedGraph[code]
            
            var vertexTeam = vertex.unit ? vertex.unit.team : vertex.town.team
                
            var unit = vertex.town ? vertex.town.occupyingUnit : vertex.unit
                    
            var unitRemained = null
            var paths = vertex.paths

            if(realDistanceToEnemy[code] == 0){
                var targetCodesToSend = []
                for(var i in paths){
                    var path = paths[i]
                    var target = mergedGraph[path.targetCode]
                    
                    var targetTeam = target.unit ? target.unit.team : target.town.team
                    
                    if(neighborTeam == null || !inTruceGraph(truceGraph,vertexTeam,neighborTeam)){
                        var targetCode = path.targetCode
                        if(targetTeam != vertexTeam){
                            targetCodesToSend.push(path.targetCode)
                        }
                    }
                }
                
                for(var i in targetCodesToSend){
                    var targetCode = targetCodesToSend[i]
                    
                    diffValuePerCode[targetCode] += valuePerCode[code] / targetCodesToSend.length
                }
            }
            //if(moved > 52)
            //    break
        }
        
        for(var codeIndex in codes){
            var code = codes[codeIndex]
            var vertex = mergedGraph[code]
            
            valuePerCode[code] -= diffValuePerCode[code]
        }
        return valuePerCode
        //console.log(valuePerCode)
    }

    uniquePathTargets(array){
        if(array.length == 0)
            return []
        var newArray = [array[0]]
        array.sort((a,b) => a.target.x-b.target.x)
        for(var i=1;i<array.length;i++){
            if(array[i].target.x != newArray[newArray.length-1].target.x/* || array[i].target.y != newArray[newArray.length-1].target.y*/)
                newArray.push(array[i])
        }
        return newArray
    }
    pathsFromGraph(closestTargets,graph,sea){
        var paths = []
        for(var i in closestTargets){
            var target = closestTargets[i]
            
            var code = target.x+'#'+target.y
            
            if(code in graph){
                var distance = 0
                var g1 = graph[code]
                var path = []
                while(g1 != null){
                    path.push(g1.point)
                    distance += g1.dist
                    g1 = g1.from
                }
                if(distance > 0){
//                    path.push([target.x,target.y])
                    var newPath = path.slice().reverse()
                    newPath[newPath.length-1] = [target.x,target.y]
                    paths.push({target:target,targetCode:target.x+'#'+target.y,path:newPath,dist:distance,sea:sea})
                }
            }
        }
        return paths
    }

    concatPathsUnique(paths1,paths2){
        var newPaths = paths1.concat(paths2).sort((a,b)=>a.targetCode.localeCompare(b.targetCode))
        if(newPaths.length == 0)
            return []
        var result = [newPaths[0]]
        for(var i = 1;i<newPaths.length;i++){
            if(newPaths[i-1].targetCode != newPaths[i].targetCode)
                result.push(newPaths[i])
        }
        return result
    }
    mergedGraph(standardGraph,graph){
        var model = this.model()
        var mergedGraph = {}
        
        for(var target_code in standardGraph){
            var graphPoint = standardGraph[target_code]

            mergedGraph[target_code] = {
                unit:graphPoint.unit,
                town:graphPoint.town,
                paths:graphPoint.paths.map(
                    path => new Object({
                        target:path.target,
                        path:path.path,
                        dist:path.dist,
                        sea:path.sea,
                        targetCode:path.targetCode
                    })
                )
            }
        }
        
        for(var target_code in graph){
            var graphPoint = graph[target_code]

            if(!(target_code in mergedGraph)){
                mergedGraph[target_code] = {
                    unit:graphPoint.unit,
                    town:graphPoint.town,
                    paths:graphPoint.paths.map(
                        path => new Object({
                            target:path.target,
                            path:path.path,
                            dist:path.dist,
                            sea:path.sea,
                            targetCode:path.targetCode
                        })
                    )
                }
            } else {
                mergedGraph[target_code].paths = mergedGraph[target_code].paths.concat(
                    graphPoint.paths.map(
                        path => new Object({
                            target:path.target,
                            path:path.path,
                            dist:path.dist,
                            sea:path.sea,
                            targetCode:path.targetCode
                        })
                    )
                )
            }
        }
        
        for(var target_code in graph){
            var mgtc = mergedGraph[target_code]

            for(var i in mgtc.paths){
                var path = mgtc.paths[i]
                
                var add = true
                var targetCode = path.targetCode
                for(var j in mergedGraph[targetCode].paths){
                    var path2 = mergedGraph[targetCode].paths[j]
                    
                    if(path2.targetCode == target_code){
                        add = false
                        break
                    }
                }
                if(mergedGraph[targetCode].town != null){
                    if(add){
                        mergedGraph[targetCode].paths.push(new Object({
                            target:mgtc.unit,
                            path:path.path.slice().reverse(),
                            dist:path.dist,
                            sea:path.sea,
                            targetCode:target_code
                        }))
                    }
                }
            }
        }
        
        for(var target_code in mergedGraph){
            var vertex = mergedGraph[target_code]
            vertex.paths = this.toGabrielGraph(vertex.paths)
            vertex.distanceToEnemy = Infinity
            vertex.distanceToEnemyLevel = Infinity
            vertex.neighborsEnemy = 0
        }
        
        var truceGraph = relationColorGraph('truce',model)

        for(var j = 0;j<12;j++){
            for(var target_code in mergedGraph){
                var vertex = mergedGraph[target_code]

                var team = vertex.unit ? vertex.unit.team : vertex.town.team
                if(team != null){                
                    var usedVertices = {}
                    usedVertices[vertex.targetCode] = true
                    
//                    var vertexStack = vertex.paths.map(a => new Object({code:a.targetCode, dist:a.dist, vertex:mergedGraph[a.targetCode]}))
                    
                    for(var i in vertex.paths){
                        var pathObject = vertex.paths[i]
                        
                        var neighboringVertex = mergedGraph[pathObject.targetCode]
                        var neighborTeam = neighboringVertex.unit ? neighboringVertex.unit.team : neighboringVertex.town.team

                        if(neighborTeam != team && neighborTeam != null && !inTruceGraph(truceGraph,team,neighborTeam)){
                            if(vertex.distanceToEnemy > pathObject.dist)
                                vertex.distanceToEnemy = pathObject.dist
                            vertex.neighborsEnemy++
                        } else if(vertex.distanceToEnemy > pathObject.dist + neighboringVertex.distanceToEnemy){
                            vertex.distanceToEnemy = pathObject.dist + neighboringVertex.distanceToEnemy
                        }
                        if(neighborTeam != team && neighborTeam != null && !inTruceGraph(truceGraph,team,neighborTeam)){
                            vertex.distanceToEnemyLevel = 0
                        } else if(vertex.distanceToEnemyLevel > neighboringVertex.distanceToEnemyLevel + 1){
                            vertex.distanceToEnemyLevel = neighboringVertex.distanceToEnemyLevel + 1
                        }
                    }
                    
                    /*

class GameHistory {
    constructor(model){
        this.model = model
        
        this.states = []
        
        this.currentTime = 0
    }
    setCurrentTime(time){
        this.currentTime = time
    }
    /*
    
	groupedMergedVoronois:[{
		voronois:[{
			landArea
			unitCount
		}],
		area,
		embarkedCount,
		team,
		unitCount
	}],
    */
    registerSnapshot(){
        this.states.push({
            playerChoosen:this.model.playerChoosen,
            groupedMergedVoronois:this.model.groupedMergedVoronois.map(a => new Object({
                voronois:a.voronois.map(b => new Object({
                    landArea:b.landArea,
                    unitCount:b.unitCount
                })),
                area:a.area,
                embarkedCount:a.embarkedCount,
                team:a.team,
                unitCount:a.unitCount,
            })),
            mergedVoronois:this.model.mergedVoronois.map(a => new Object({
                voronoi:a.voronoi.map(b => b.slice()),
                team:a.team
            })),
            towns:this.model.towns.map(a => new Object({
                x:a.x,
                y:a.y,
                team:a.team
            })),
            units:this.model.units.map(a => new Object({
                x:a.x,
                y:a.y,
                size:a.size,
                towntaken:a.towntaken ? true : null,
                embarking:a.embarking,
                embarkingProgress:a.embarkingProgress,
                path:[],
                team:a.team
            })),
            wholeRealLandArea:this.model.wholeRealLandArea,
            realLandArea:this.model.realLandArea,
            diplomacyQueue:this.model.diplomacyQueue.map(a => new Object({
                type:a.type,
                from:a.from,
                to:a.to,
                time:a.time
            })),
            diplomacyRelations:this.model.diplomacyRelations.map(a => new Object({
                type:a.type,
                from:a.from,
                to:a.to,
                time:a.time
            })),
        })
    }
    getCurrentModelData(){
        return this.states[this.currentTime]
    }
}

    }

        let t = this

        this.canv.addEventListener('mousedown',(e) => this.mouseDown(e))
        this.canv.addEventListener('mousemove',(e) => this.mouseMove(e))
        this.canv.addEventListener('mouseup',(e) => this.mouseUp(e))
        
        window.addEventListener('keydown',(e) => t.keyDown(e))

        if(coords.x > this.view.PADDING && coords.y > this.view.PADDING && coords.x < this.model.WIDTH+this.view.PADDING && coords.y < this.model.WIDTH+this.view.PADDING){

            else
                this.model.click(null,null)
        }*/

        switch(e.key){
            case ' ':
                this.pausePlay()
            break
        }
        this.view.draw()
    }
    mouseDown(e){
        e.preventDefault()
        var coords = this.getCoordsFromEvent(e)
        
        this.state.state.setMouseCoords(coords)
        
        if(this.state.state.interaction){
            this.pressedUnit = this.view.getUnitByMouse(this.view.modelMouseCoords())
            if(this.pressedUnit == null){
                this.dragStart = coords
                this.mapPressStart = this.view.modelMouseCoords()
            }
        }
        
        this.state.state.mouseDown(coords)
    }
    mouseMove(e){
        e.preventDefault()
        var coords = this.getCoordsFromEvent(e)
        
        this.state.state.setMouseCoords(coords)
        this.state.state.mouseMove(coords)
        this.view.draw()
    }
    mouseUp(e){
        e.preventDefault()
        var coords = this.getCoordsFromEvent(e)
        var modelCoords = this.view.modelMouseCoords()
        
        if(this.state.state.interaction){
            if(modelCoords != null)
                if(this.model.selectedUnit == null){
                    if(this.pressedUnit != null){
                        var currentlyPressedUnit = this.view.getUnitByMouse(modelCoords)

                        if((currentlyPressedUnit.team == this.model.playerChoosen || !this.state.state.gameplay) && currentlyPressedUnit == this.pressedUnit && !currentlyPressedUnit.inProcessOfEmbarking()){

                            if(!this.state.state.gameplay){
                                this.model.playerChoosen = this.model.selectedUnit.team
                                this.changeState(new GamePlayUnselected(this))
                            }
                        }
                        this.state.state.chosenTeam = null
                    } else if(this.state.state.highlightedTeam != null && this.state.state.gameplay) {
                        if(dist(modelCoords.x,modelCoords.y,this.mapPressStart.x,this.mapPressStart.y) < 2){
                            this.state.state.chosenTeam = this.state.state.chosenTeam == this.state.state.highlightedTeam || this.state.state.highlightedTeam == this.model.playerChoosen

                                : this.state.state.highlightedTeam

    getCoordsFromEvent(e){
        var rect = this.canv.getBoundingClientRect()
        
        var x,y
        if(e.touches != undefined && e.touches.length > 0){
            x = (e.touches[0].clientX - rect.left) / rect.width * this.canv.width
            y = (e.touches[0].clientY - rect.top) / rect.height * this.canv.height
        } else {
            x = (e.clientX - rect.left) / rect.width * this.canv.width
            y = (e.clientY - rect.top) / rect.height * this.canv.height
        }
        
        return {x:x,y:y}
    }
    pausePlay(){
        this.state.pause = !this.state.pause
    }
    loop(){
        let t = this
        t.frameCounter++
        
        if(!this.state.pause){
            this.model.update(this.state.state.gameplay)
            this.view.draw()
            if(this.state.state.gameplay && t.frameCounter % 5 == 1){
                t.gameHistory.registerSnapshot()
            }
        }
        if(t.frameCounter % 30 == 0){
            if(this.state.state.gameplay)
                t.ai.think()
            else
                t.ai.tryReset()
        }
        t.ai.debug()
        setTimeout(()=>{t.loop()},100)
    }
