function pointInsideVerticalLinearLimit(x,x0,left){
    return (x < x0-0.00000001) && left || (x > x0+0.00000001) && !left
}
function pointInsideNonVerticalLinearLimit(x,y,a,b,bottom){
    return (a*x + b < y-0.00000001) && bottom || (a*x + b > y+0.00000001) && !bottom
}
function lineFromTwoPoints(x1,y1,x2,y2){
    if(x1 == x2){
        if(y1 == y2)
            throw new Error('Two points are in the same places: '+x1+', '+y1)
        return {vertical:true,x:x1}
    }
    
    var a = (y1-y2) / (x1-x2)
    return {vertical:false, a:a, b: y1 - x1 * a}
}
function distanceFromLine(px,py,l1,l2){
    var x1 = l1[0]
    var y1 = l1[1]
    var x2 = l2[0]
    var y2 = l2[1]
    if(x1 == x2){
        if(y1 == y2)
            throw new Error('Two points are in the same places: '+x1+', '+y1)
        return Math.abs(x1-px)
    }
    
    var a = (y1-y2) / (x1-x2)
    var b = y1 - x1 * a
    
    return Math.abs( a * px - py + b ) / Math.sqrt( a*a + 1 )
}
function polygonBordersBandOld(poly,band){
    for(var i in poly){
        var polyBand = poly[i]
        
        for(var k in band){
            var segment2_0 = band[k]
            var segment2_1 = band[(k-(-1)) % band.length]
            if(polyBand.length > 1)
                for(var j in polyBand){
                    var polyPoint = polyBand[j]
                    
                    if(
                        (polyPoint[0] >= segment2_0[0] && polyPoint[0] <= segment2_1[0] || polyPoint[0] >= segment2_1[0] && polyPoint[0] <= segment2_0[0])
                            &&
                        (polyPoint[1] >= segment2_0[1] && polyPoint[1] <= segment2_1[1] || polyPoint[1] >= segment2_1[1] && polyPoint[1] <= segment2_0[1])
                            &&
                            distanceFromLine(polyPoint[0],polyPoint[1],segment2_0,segment2_1) <= 0.1
                        )
                            return true
                        
                }
        }
    }
    return false
}
function getBoundsFromSegments(segments){
    var left = Infinity
    var right = -Infinity
    var top = Infinity
    var bottom = -Infinity
    for(var i=0;i<segments.length;i++){
        var p1 = segments[i][0]
        var p2 = segments[i][1]
                
        if(p1[0] < left)
            left = p1[0]
        if(p1[0] > right)
            right = p1[0]
        if(p1[1] < top)
            top = p1[1]
        if(p1[1] > bottom)
            bottom = p1[1]
    }
    //throw new Error('a')

    return {
        left:left,
        right:right,
        top:top,
        bottom:bottom,
    }
}
function boundIntersection(bounds1,bounds2){
    var left = Math.max(bounds1.left,bounds2.left)
    var right = Math.min(bounds1.right,bounds2.right)
    var top = Math.max(bounds1.top,bounds2.top)
    var bottom = Math.min(bounds1.bottom,bounds2.bottom)
    
    if(left > right)
        return null
    if(top > bottom)
        return null
    
    return {
        left:left,
        right:right,
        top:top,
        bottom:bottom,
    }
}
function filterSegmentsByBounds(segments, bounds){
    return segments.filter(
        s => s[0][0] > bounds.left && s[0][0] < bounds.right && s[0][1] > bounds.top && s[0][1] < bounds.bottom
          || s[1][0] > bounds.left && s[1][0] < bounds.right && s[1][1] > bounds.top && s[1][1] < bounds.bottom)
}
function polygonBordersBand(poly,band){
    var allSegments = getPolygonSegments(poly)
    var segmentBounds = getBoundsFromSegments(allSegments)
    
    var bandSegments = getBandSegments(band)
    var bandBounds = getBoundsFromSegments(bandSegments)
    
    var intersectedBounds = boundIntersection(segmentBounds, bandBounds)
    
    if(intersectedBounds == null)
        return false
        
    //return polygonBordersBandOld(poly,band) //TODO
    
    var filteredSegments = filterSegmentsByBounds(allSegments,intersectedBounds)
    var filteredBandSegments = filterSegmentsByBounds(bandSegments,intersectedBounds)
    return polygonBordersBandRecursive(filteredSegments,filteredBandSegments,intersectedBounds,12)
}
function polygonBounds(polygon){
    var allSegments = getPolygonSegments(polygon)
    return getBoundsFromSegments(allSegments)
}
function multiPolygonBounds(polygons){
    var allSegments = polygons.map(poly => getPolygonSegments(poly)).flat()

function polygonBordersBandRecursive(segments,bandSegments,bounds,steps){
    if(segments.length == 0 || bandSegments.length == 0){
        return false
    }
    if(steps > 0){
        //var segments1,segments2,bandSegments1,bandSegments2
        var bounds1,bounds2
        if(bounds.right - bounds.left > bounds.bottom - bounds.top){
            bounds1 = {
                left:bounds.left,
                right:(bounds.left+bounds.right)/2,
                top:bounds.top,
                bottom:bounds.bottom,
            }
            bounds2 = {
                left:(bounds.left+bounds.right)/2,
                right:bounds.right,
                top:bounds.top,
                bottom:bounds.bottom,
            }
        } else {
            bounds1 = {
                left:bounds.left,
                right:bounds.right,
                top:bounds.top,
                bottom:(bounds.top+bounds.bottom)/2,
            }
            bounds2 = {
                left:bounds.left,
                right:bounds.right,
                top:(bounds.top+bounds.bottom)/2,
                bottom:bounds.bottom,
            }
        }
        var filteredSegments1 = filterSegmentsByBounds(segments,bounds1)
        var filteredBandSegments1 = filterSegmentsByBounds(bandSegments,bounds1)

        var filteredSegments2 = filterSegmentsByBounds(segments,bounds2)
        var filteredBandSegments2 = filterSegmentsByBounds(bandSegments,bounds2)
//        console.log(filteredSegments1, filteredSegments2)
//        console.log(filteredBandSegments1, filteredBandSegments2)

//        throw new Error('a')
        
        return polygonBordersBandRecursive(filteredSegments1,filteredBandSegments1,bounds1,steps-1)
                ||
               polygonBordersBandRecursive(filteredSegments2,filteredBandSegments2,bounds2,steps-1)
    } else {
        for(var i in segments){
            var s1 = segments[i][0]
            for(var j in bandSegments){
                var b1 = bandSegments[j][0]
                var b2 = bandSegments[j][1]
                if(
                    
                        distanceFromLine(s1[0],s1[1],b1,b2) <= 0.1
                    )
                        return true
            }
        }
        return false
    }
}
function bisectorFromTwoPoints(x1,y1,x2,y2){
    if(y1 == y2){
        if(x1 == x2)
            throw new Error('Two points are in the same places: '+x1+', '+y1)
        return {vertical:true,x:(x1+x2)/2,firstLeftBottom:x1 < x2}
    }
    
    var a = (x2-x1) / (y1-y2)
    return {vertical:false, a:a, b: (y1 + y2 - a * (x1 + x2)) / 2,firstLeftBottom: y1 > y2}
}

function pointOutsideGabrielArea(p1,p2,x,y){
    if(p1.y == p2.y){
        if(p1.x == p2.x)
            throw new Error('Two points are in the same places: '+p1.x+', '+p1.y)
//        return {vertical:true,x:(x1+x2)/2,firstLeftBottom:x1 < x2}
        return p1.x >= p2.x && x < p2.x || p1.x <= p2.x && x > p2.x
    }
    
    var a = (p2.x-p1.x) / (p1.y-p2.y)
    var b = p2.y - a*p2.x
    
    return p1.y < p2.y ? y > a*x+b : y < a*x+b
}

function intersectionOfNonVerticalLineAndVerticalLine(a,b,x){    
    return [x, a * x + b]
}
function intersectionOfTwoNonVerticalLines(a1,b1,a2,b2){    
    if(a1-a2 == 0)
        return null
    var x = (b2 - b1) / (a1 - a2)
    return [x, a1 * x + b1]
}

function intersectionOfVerticalLineAndLineEquation(x,eq){
    if(eq.vertical){
        return null
    } else {
        return intersectionOfNonVerticalLineAndVerticalLine(eq.a,eq.b,x)
    }
}
function intersectionOfNonVerticalLineAndLineEquation(a,b,eq){
    if(eq.vertical){
        return intersectionOfNonVerticalLineAndVerticalLine(a,b,eq.x)
    } else {
        return intersectionOfTwoNonVerticalLines(a,b,eq.a,eq.b)
    }
}
function pointsEqual(p1,p2){
    return Math.abs(p1[0]-p2[0]) < 0.00000001 && Math.abs(p1[1]-p2[1]) < 0.00000001
}

function getPolygonSegments(poly){
    var segments = []
    for(var i in poly){
        var band = poly[i]
        for(var j in band){
            var point1 = band[j]
            var point2 = band[(j-(-1)) % band.length]
            
            segments.push([point1,point2])
        }
    }
    return segments
}
function getBandSegments(band){
    var segments = []
    for(var j in band){
        var point1 = band[j]
        var point2 = band[(j-(-1)) % band.length]
        
        segments.push([point1,point2])
    }
    return segments
}

function polygonOrder(polygon){
    var minY = polygon.map(a=>a[1]).reduce((a,b)=>Math.min(a,b),Infinity)
    
    var minimal = polygon.filter(a => a[1] == minY).sort((a,b)=>b[0]-a[0])[0]
    
    var ix = -1
    for(var i in polygon){
        if(polygon[i] == minimal){
            ix = i
            break
        }
    }
    var p1 = polygon[ix]
    var p2 = polygon[(ix-1+polygon.length)%polygon.length]
    var p3 = polygon[(ix-(-1))%polygon.length]
    
    var v1 = [p2[0]-p1[0],p2[1]-p1[1]]
    var v2 = [p3[0]-p1[0],p3[1]-p1[1]]
    
    return -Math.sign(v1[0]*v2[1]-v1[1]*v2[0])
}
function verticalLinearLimitPolygons(polygons,x,left){

            var ix = 0
            for(var j = 0;j<band.length;j++){
                var point1 = band[j]
                var point2 = band[(j-(-1)) % band.length]
                point1 = [Math.round(point1[0]*(2**40))/(2**40),Math.round(point1[1]*(2**40))/(2**40)]
                point2 = [Math.round(point2[0]*(2**40))/(2**40),Math.round(point2[1]*(2**40))/(2**40)]
                
                var p1inside = pointInsideVerticalLinearLimit(point1[0],x,left)
                var p2inside = pointInsideVerticalLinearLimit(point2[0],x,left)
                
                if(p1inside && p2inside){
                    bandArrayToAdd.push(point1)
                    ix++
                } else if(p1inside && !p2inside){
                    bandArrayToAdd.push(point1)
                    ix++
                    var lineEquation = lineFromTwoPoints(point1[0],point1[1],point2[0],point2[1])
                    
                    var pointInside = intersectionOfVerticalLineAndLineEquation(x,lineEquation)

                    bandArrayToAdd.push(pointInside)
                    
                    polygonIntersectionIndexes.push([ii,ix,pointInside])

                }

            polygonIntersectionIndexes = polygonIntersectionIndexes.sort((a,b)=>a[2][1]-b[2][1])

function splitPolygonsByIntersectionsAndAddToNewPolygons(newPolygon,polygonIntersectionIndexes,leftBottom,newPolygons){

    }

function polygonToGraph(intersected,reversed){
    var graph = {}
    for(var j in intersected){
        var band = intersected[j]
        var kdif = 0
        for(var k=0;k<band.length;k++){
            var point1,point2
            if(reversed ^ (j == 0)){
                point1 = band[(k-(-1))%band.length]
                point2 = band[(k+band.length-kdif)%band.length]
            } else {
                point1 = band[(k+band.length-kdif)%band.length]
                point2 = band[(k-(-1))%band.length]
            }
            point1 = [Math.round(point1[0]*(2**40))/(2**40),Math.round(point1[1]*(2**40))/(2**40)]
            point2 = [Math.round(point2[0]*(2**40))/(2**40),Math.round(point2[1]*(2**40))/(2**40)]
//            if(point1[0] == point2[0] && point1[1] == point2[1]){
//            if(point1[0] == point2[0] && point1[1] == point2[1]){
            if(pointsEqual(point1,point2)){
                kdif++
				continue
            }
            kdif = 0
            var kod = point1[0]+'#'+point1[1]
//            if(!(kod in graph))
//                graph[kod] = []
//            graph[kod].push({codeTo:point2[0]+'#'+point2[1],pointFrom:point1,pointTo:point2,angle:Math.atan2(point2[1]-point1[1], point2[0]-point1[0])})
            graph[kod] = {codeTo:point2[0]+'#'+point2[1],pointFrom:point1,pointTo:point2}
        }
    }
    return graph
}

function segmentsIntersection(a1,a2,b1,b2){
    var x1 = a1[0]
    var y1 = a1[1]
    var x2 = a2[0]
    var y2 = a2[1]
    var x3 = b1[0]
    var y3 = b1[1]
    var x4 = b2[0]
    var y4 = b2[1]
    
    var divisor = (x1 - x2) * (y3 - y4) - (y1 - y2) * (x3 - x4)
    
    return [
        ((x1*y2 - y1*x2) * (x3 - x4) - (x1 - x2) * (x3*y4 - y3*x4)) / divisor,
        ((x1*y2 - y1*x2) * (y3 - y4) - (y1 - y2) * (x3*y4 - y3*x4)) / divisor
    ]
}
function ccw(a,b,c){
    return (c[1]-a[1]) * (b[0]-a[0]) >= (b[1]-a[1]) * (c[0]-a[0])
}
function segmentsIntersecting(a1,a2,b1,b2){
    return ccw(a1,b1,b2) != ccw(a2,b1,b2) && ccw(a1,a2,b1) != ccw(a1,a2,b2)
}

function boundIntersectionWithSegment(segment,bounds){
    var segmentLeft = Math.min(segment[0][0],segment[1][0])
    var segmentRight = Math.max(segment[0][0],segment[1][0])
    var segmentTop = Math.min(segment[0][1],segment[1][1])
    var segmentBottom = Math.max(segment[0][1],segment[1][1])
    
    var left = Math.max(segmentLeft,bounds.left)
    var right = Math.min(segmentRight,bounds.right)
    var top = Math.max(segmentTop,bounds.top)
    var bottom = Math.min(segmentBottom,bounds.bottom)
    
    var result = (left <= right && top <= bottom)

    return result
}

function segmentsIntersectionsWithPolygon(a,b,polygon){
    var intersections = []
    for(var i = 0;i<polygon.length;i++){
        var band = polygon[i]
        for(var j = 0;j<band.length;j++){
            var p1 = band[j]
            var p2 = band[(j-(-1))%band.length]
            
            var pointsOnTheSameLine
            if(pointsOnTheSameLine = segmentsOnTheSameLine(a,b,p1,p2)){
                intersections = intersections.concat(pointsOnTheSameLine)
                intersections = intersections.map(intersection => [Math.round(intersection[0]*(2**40))/(2**40),Math.round(intersection[1]*(2**40))/(2**40)])
            } else if(segmentsIntersecting(a,b,p1,p2)){
                var intersection = segmentsIntersection(a,b,p1,p2)
                intersection = [Math.round(intersection[0]*(2**40))/(2**40),Math.round(intersection[1]*(2**40))/(2**40)]
                intersections.push(intersection)
            }
        }
    }
    if(a[0] == b[0]){
        if(a[1] < b[1]){
            return intersections.sort((aa,bb)=>aa[1] - bb[1])
        } else {
            return intersections.sort((aa,bb)=>bb[1] - aa[1])
        }
    } else if(a[0] < b[0]) {
        return intersections.sort((aa,bb)=>aa[0] - bb[0])
    } else {
        return intersections.sort((aa,bb)=>bb[0] - aa[0])
    }
    return intersections
}
function pointOnLine(x,y,p1,p2){
    return (p1[0] <= p2[0] && p1[0] <= x && x <= p2[0] || p2[0] <= p1[0] && p2[0] <= x && x <= p1[0])
            &&
           (p1[1] <= p2[1] && p1[1] <= y && y <= p2[1] || p2[1] <= p1[1] && p2[1] <= y && y <= p1[1]) 
            &&
            distanceFromLine(x,y,p1,p2) < 0.00000001
}
function segmentsOnTheSameLine(a,b,p1,p2){
    var points = []
    if((p1[0] <= a[0] && a <= p2[0] || p2[0] <= a[0] && a[0] <= p1[0]) && (p1[1] <= a[1] && a[1] <= p2[1] || p2[1] <= a[1] && a[1] <= p1[1])){
        if(!pointsEqual(a,p1) && !pointsEqual(a,p2) && distanceFromLine(a[0],a[1],p1,p2) < 0.00000001){
            points.push(a)
        }
    }
    if((p1[0] <= b[0] && b <= p2[0] || p2[0] <= b[0] && b[0] <= p1[0]) && (p1[1] <= b[1] && b[1] <= p2[1] || p2[1] <= b[1] && b[1] <= p1[1])){
        if(!pointsEqual(b,p1) && !pointsEqual(b,p2) && distanceFromLine(b[0],b[1],p1,p2) < 0.00000001){
            points.push(b)
        }
    }
    if(points.length > 0)
        return points
    return null

function segmentsIntersectingWithPolygonsCount(a,b,polygons){

    var count = 0
    for(var i in polygons){
        var polygon = polygons[i]
        count += segmentsIntersectingWithPolygonCount(a,b,polygon)
    }
    return count
}
function hitTestBand(poly,x,y,inclusive){
    var segmentsToCheck = []
    for(var i in poly){
        var s = [poly[i], poly[(i-(-1))%poly.length]]
        if(s[0][0] > s[1][0])
            s = s.slice().reverse()
        
        if(s[0][0] < x && s[1][0] > x){
            segmentsToCheck.push(s)
        }
    }
    var number = 0
    for(var i in segmentsToCheck){
        var segment = segmentsToCheck[i]
        
        var lf2p = lineFromTwoPoints(segment[0][0],segment[0][1],segment[1][0],segment[1][1])
        
        //    return {vertical:false, a:a, b: y1 - x1 * a}

        if(y < lf2p.a*x+lf2p.b || inclusive && y <= lf2p.a*x+lf2p.b)
            number++
    }
    return number % 2 != 0
}
function hitTest(poly,x,y,inclusive){
    var result = false
    for(var i in poly){
        var band = poly[i]
        
        if(hitTestBand(band,x,y,inclusive)){
            if(i == 0)
                result = true
            else
                return false
        }
    }
    return result
}
function bandArea(poly){
    var result = 0
    for(var i in poly){
        var s1 = poly[i]
        var s2 = poly[(i-(-1))%poly.length]
        
        result += (s2[0]-s1[0])*(s1[1]+s2[1])/2
    }
    return result
}
function polygonArea(poly){
    var result = 0
    for(var i in poly){
        var band = poly[i]
        
        if(i == 0)
            result += bandArea(band)
        else
            result -= bandArea(band)
    }
    return result
}
function almostHitTest(poly,x,y,precision){
    if(precision == null)
        precision = 20
    var precise = 1/Math.pow(2,precision)
    for(var i = -precise;i<=precise;i+=precise){
        for(var j = -precise;j<=precise;j+=precise){
            if(hitTest(poly,x-(-i),y-(-j),true)){
                return true
            }
        }
    }
    return false
}
function certainlyHitTest(poly,x,y,precision){
    if(precision == null)
        precision = 20
    var precise = 1/Math.pow(2,precision)
    for(var i = -precise;i<=precise;i+=precise){
        for(var j = -precise;j<=precise;j+=precise){
            if(!hitTest(poly,x-(-i),y-(-j),false)){
                return false
            }
        }
    }
    return true
}
function hitTestInteriorOrPoint(poly,x,y){
    for(var i in poly){
        var band = poly[i]
        for(var j in band){
            var point = band[j]
            if(point[0] == x && point[1] == y)
                return true
        }
    }
    return certainlyHitTest(poly,x,y)
}
function hitTestInteriorAndNotPoint(poly,x,y){
    for(var i in poly){
        var band = poly[i]
        for(var j in band){
            var point = band[j]
            if(point[0] == x && point[1] == y){
                return false
            }
        }
    }
    return almostHitTest(poly,x,y)
}

}

    var relations = model.diplomacyRelations
    if(testedRelation)
        relations = relations.concat(testedRelation)
    for(var i in relations){
        var relation = relations[i]
        if(relation.type == type){

            if(!(relation.from.color in object))
                object[relation.from.color] = {}
            object[relation.from.color][relation.to.color] = true
        }
    }
    return object

class Chunk {
    constructor(x,y,polygons,l,t,r,b){
        this.segments = getPolygonSegments(polygons).filter(a => boundIntersectionWithSegment(a,{left:l,top:t,right:r,bottom:b}))
        
        this.l = l
        this.t = t
        this.r = r
        this.b = b
        
        this.x = x
        this.y = y
        
        polygons = nonVerticalLinearLimitPolygons(polygons,0,t,true)
        polygons = nonVerticalLinearLimitPolygons(polygons,0,b,false)
        polygons = verticalLinearLimitPolygons(polygons,l,false)
        polygons = verticalLinearLimitPolygons(polygons,r,true)
    
        this.polygons = polygons
        this.nearChunkCodes = this.createNearChunkCodes()
    }
    createNearChunkCodes(){
        var nearChunkCodes = []
        for(var i = -1;i<=1;i++){
            for(var j = -1;j<=1;j++){
                nearChunkCodes.push((this.x-(-i))+'#'+(this.y-(-j)))
            }
        }
        return nearChunkCodes

class Town {
    constructor(x,y,land,port){
        this.x = x

        this.land = land
        
        this.port = port ? port : null
        
        this.team = null
        
        this.occupyingUnit = null

    }
    setBigChunk(chunk){
        this.bigChunk = chunk
    }
    setOccupyingUnit(unit){
        this.occupyingUnit = unit
        this.team = unit.team
        unit.setTownTaken(this)
    }
    checkSegmentThrough(x1,y1,x2,y2){
        var {WIDTH} = townData()
        var l = this.x-WIDTH*5/4
        var r = this.x+WIDTH*5/4
        var t = this.y-WIDTH*2
        var b = this.y

        return  segmentsIntersecting([x1,y1],[x2,y2],[l,t],[r,t])
                || 
                segmentsIntersecting([x1,y1],[x2,y2],[l,b],[r,b])
                || 
                segmentsIntersecting([x1,y1],[x2,y2],[l,t],[l,b])
                || 
                segmentsIntersecting([x1,y1],[x2,y2],[r,t],[r,b])

    }
    checkPathThrough(path){
        for(var i = 1;i<path.length;i++){
            var p1 = path[i-1]
            var p2 = path[i]
            
            if(checkSegmentThrough(p1[0],p1[1],p2[0],p2[1]))
                return true
        }
        return false
    }
}
class Unit {
    constructor(x,y,size,team,land){
        this.x = x
        this.y = y
        this.size = size
        this.team = team
        this.land = land
        
        this.towntaken = null
        
        this.voronoi = null
        
        this.path = []
        
        this.target = null
        
        this.dead = false
        
        this.embarking = false
        this.embarkingProgress = 0
        this.embarkingProgressFloat = 0
        
        this.barkingPoint = null
        this.barkingLand = null
        
        this.attackingFloat = 0
        this.growingFloat = 0
    }
    die(){
        this.dead = true
        this.leaveTown()
    }
    setTownTaken(town){
        this.towntaken = town
    }
    setChunk(chunk){
        this.chunk = chunk
    }
    setBigChunk(chunk){
        this.bigChunk = chunk
    }
    leaveTown(){
        if(this.towntaken != null){
            this.towntaken.occupyingUnit = null
            this.towntaken = null
        }
    }
    leavePartOfUnit(division){
        var size1 = this.sizeAfterDivision(division)
        var size2 = this.size - size1
        
        this.size = size1
        if(size2 > 0){
            var newUnit = new Unit(this.x,this.y,size2,this.team,this.land)
            newUnit.setChunk(this.chunk)
            newUnit.setBigChunk(this.bigChunk)
            if(this.towntaken != null){
                this.towntaken.setOccupyingUnit(newUnit)
                this.towntaken = null
                
                if(this.embarking)
                    this.land = null
            }
            return newUnit
        } else {
            this.leaveTown()
            return null
        }
    }
    setPath(x,y,target){
        if(target != null)
            this.target = target
        else
            this.target = null
        this.path = [[x,y]]
    }
    setLinePath(path,target){
        if(target != null)
            this.target = target
        else
            this.target = null
        this.path = path.slice()
    }
    removePath(){
        this.path = []
        this.target = null
    }
    tryTakeOverTown(){
        if(this.target.occupyingUnit == null){
            this.setTargetAsTown()
        } else if(this.target.occupyingUnit.team == this.team) {
            this.tryToMergeWithUnit(this.target.occupyingUnit)
            this.target = null
        }
    }
    tryToMergeWithTarget(){
        var unitTarget = this.target instanceof Town ? this.target.occupyingUnit : this.target
        this.tryToMergeWithUnit(unitTarget)
        this.target = null
        this.removePath()
    }
    tryToMergeWithUnit(unit){
        if(!this.dead){
            if(this.size + unit.size > 99){
                this.size = this.size + unit.size - 99
                unit.size = 99
            } else {
                unit.size -= -this.size
                this.die()
            }
            this.embarkingProgress = this.size
            unit.embarkingProgress = unit.size
        }
    }
    setTargetAsTown(){
        this.towntaken = this.target
        this.target.setOccupyingUnit(this)
        this.target = null
        this.land = this.towntaken.land

        this.embarking = false
        this.barkingPoint = null
        this.barkingLand = null
    }
    tooClose(unit2){
        var {WIDTH,HEIGHT,OFFSET,PADDING} = unitData()
        
        return Math.abs(this.x - unit2.x) < WIDTH && Math.abs(this.y - unit2.y) < HEIGHT
    }
    atPathEndAndInDirection(unit2,pathCanBeEmpty){
        if(this.path.length == 0 && !pathCanBeEmpty)
            return false
        var {WIDTH,HEIGHT,OFFSET,PADDING} = unitData()

        var pathTargetX,pathTargetY
        if(this.path.length > 0){
            pathTargetX = this.path[this.path.length - 1].x
            pathTargetY = this.path[this.path.length - 1].y
        } else {
            pathTargetX = unit2.x
            pathTargetY = unit2.y
        }
        
        return (this.x < unit2.x && this.x < pathTargetX || this.x > unit2.x && this.x > pathTargetX) &&
               (this.y < unit2.y && this.y < pathTargetY || this.y > unit2.y && this.y > pathTargetY) &&
                Math.abs(this.x - pathTargetX) < WIDTH*2 && Math.abs(this.y - pathTargetY) < HEIGHT*2
    }
    checkSegmentThrough(x1,y1,x2,y2){
        var {WIDTH,HEIGHT,OFFSET,PADDING} = unitData()
        var l = this.x-WIDTH/2
        var r = this.x+WIDTH/2
        var t = this.y-HEIGHT/2
        var b = this.y+HEIGHT/2
        //        return mouseCoords != null && mouseCoords.x > unit.x-WIDTH/2 && mouseCoords.x < unit.x+WIDTH/2 && mouseCoords.y > unit.y-HEIGHT/2-OFFSET && mouseCoords.y < unit.y+HEIGHT/2-OFFSET


        return  segmentsIntersecting([x1,y1],[x2,y2],[l,t],[r,t])
                || 
                segmentsIntersecting([x1,y1],[x2,y2],[l,b],[r,b])
                || 
                segmentsIntersecting([x1,y1],[x2,y2],[l,t],[l,b])
                || 
                segmentsIntersecting([x1,y1],[x2,y2],[r,t],[r,b])

    }
    checkPathThrough(path){
        for(var i = 1;i<path.length;i++){
            var p1 = path[i-1]
            var p2 = path[i]
            
            if(checkSegmentThrough(p1[0],p1[1],p2[0],p2[1]))
                return true
        }
        return false
    }
    sizeAfterDivision(division){
        return Math.ceil(this.size * division)
    }
    inProcessOfEmbarking(){
        return unitInProcessOfEmbarking(this) 
    }
    tryDisembark(){
        if(this.barkingPoint != null && this.path.length == 1){
            var p1 = [this.x,this.y]
            var p2 = this.path[0]
            
            if( this.embarking && this.embarkingProgress >= this.size && 
                (p1[0] < p2[0] && p1[0] > this.barkingPoint[0] || p1[0] > p2[0] && p1[0] < this.barkingPoint[0])
                    &&
                (p1[1] < p2[1] && p1[1] > this.barkingPoint[1] || p1[1] > p2[1] && p1[1] < this.barkingPoint[1])
            ){
                this.embarking = false
                this.land = this.barkingLand
                this.barkingPoint = null
                this.barkingLand = null
            } else if(!this.embarking){
                this.land = this.barkingLand
                this.barkingPoint = null
                this.barkingLand = null
            }
        }
    }
}

    populateTowns(teamConfiguration){
        var amount = 0
        var multitown = false
        var fewTeams = false
        switch(teamConfiguration){
            case 'MORE': amount = Math.ceil(0.5 * this.towns.length);break;
            case 'ALL': amount = this.towns.length;break;
            case 'FEW': amount = Math.ceil(0.2 * this.towns.length);break;
            case 'MULTITOWN': amount = Math.ceil(0.2 * this.towns.length);multitown = true;break
            case 'TWO TEAMS': amount = 2;fewTeams = true;break
        }
        
        var shuffledTowns = this.towns.map(value => ({ value, sort: Math.random() }))
                    .sort((a, b) => a.sort - b.sort)
                    .map(({ value }) => value)
                    
        
        for(var i in shuffledTowns){
            var town = shuffledTowns[i]                
            var chunk = this.getChunkFromCoords(town.x,town.y)
            var bigChunk = this.getBigChunkFromCoords(town.x,town.y)
            town.setChunk(this.chunks[chunk])
            town.setBigChunk(this.bigChunks[bigChunk])

            if(i < amount || i == 1){
                var teamColor = getRandomColor()
                while(this.teams.filter(a => a.color == teamColor).length > 0)
                    teamColor = getRandomColor()
                    
                var newTeam = new Team(teamColor,true)
                
                this.teams.push(newTeam)
                
                var newUnit = new Unit(town.x,town.y,10+Math.ceil(Math.random()*89),newTeam,town.land)
                this.addUnitToTown(newUnit,town)
            }
        }
        if(multitown)
            for(var k = 0;k<5;k++){
                var used = new Set()
                for(var i in this.towns){
                    var town1 = this.towns[i]
                    if(town1.team != null && !used.has(town1)){
                        var closest = null
                        var closestDist = Infinity
                        for(var j in this.towns){
                            var town2 = this.towns[j]
                            if(town2.team == null){
                                var dist = eucl_dist(town1.x,town1.y,town2.x,town2.y)
                                if(dist < closestDist && dist < this.WIDTH / this.CHUNKS_PER_SIDE * 2){
                                    closest = town2
                                    closestDist = dist
                                }
                            }
                            
                        }
                        if(closest != null){                
                            var newUnit = new Unit(closest.x,closest.y,10+Math.ceil(Math.random()*89),town1.team,closest.land)
                            this.addUnitToTown(newUnit,closest)
                            used.add(closest)
                        }
                    }
                }
            }
        if(fewTeams){
            for(var i in this.towns){
                var town = this.towns[i]
                if(town.occupyingUnit == null){
                    var team = this.teams[i % amount]
                    
                    var newUnit = new Unit(town.x,town.y,10+Math.ceil(Math.random()*89),team,town.land)
                    this.addUnitToTown(newUnit,town)
                }
            }
        }
    }
    addUnitToTown(newUnit,town){
        var chunk = this.getChunkFromCoords(newUnit.x,newUnit.y)
        var bigChunk = this.getBigChunkFromCoords(newUnit.x,newUnit.y)

        newUnit.setChunk(this.chunks[chunk])
        newUnit.setBigChunk(this.bigChunks[bigChunk])
        
        this.units.push(newUnit)
        
        town.setOccupyingUnit(newUnit)
    }

    expandVoronoisToLostOnes(){
        var voronoiables = this.getVoronoiables().filter(a => a.voronoi != null && a.team != null && a.occupyingUnit == null)
        
        var voronoiableByChunk = {}
        for(var key in this.chunks){
            voronoiableByChunk[key] = []
        }
        for(var i in voronoiables){
            var voronoiable = voronoiables[i]
            
            var chunk = voronoiable.chunk
            var nearbyCodes = chunk.nearChunkCodes
            for(var j in nearbyCodes){
                var nearbyCode = nearbyCodes[j]
                if(nearbyCode in this.chunks){
                    voronoiableByChunk[nearbyCode].push(voronoiable)
                }
            }
        }

        for(var i in this.lostVoronoiParts){
            var polygon = this.lostVoronoiParts[i].polygon
            var chunk = this.lostVoronoiParts[i].chunk
            
            var chunkcode = chunk.x+'#'+chunk.y
            var voronoiables = voronoiableByChunk[chunkcode]
            
            var mergedOnes = []
            for(var j in voronoiables){
                var voronoiable = voronoiables[j]
                
                if(voronoiable.voronoi != null){
                    if(polygonBordersBandOld(voronoiable.voronoi,polygon[0])){
                        var merged = mergePolygonsOnSides(voronoiable.voronoi,polygon,true)
                        if(merged != null){
                            voronoiable.voronoi = merged
                            mergedOnes.push(voronoiable)
                        }
                    }
                }
            }
            for(var j in mergedOnes){
                var merged1 = mergedOnes[j]
                if(merged1.voronoi == null)
                    continue
                    
                var newLands = [merged1.voronoi.map(a => a.slice())]
                for(var k in mergedOnes){
                
                    if(newLands.length == 0)
                        break
                        
                    var merged2 = mergedOnes[k]
                                            
                    if(merged1 == merged2)
                        continue
                    
                    var bisector = bisectorFromTwoPoints(merged1.x,merged1.y,merged2.x,merged2.y)

                    try {
                        if(bisector.vertical){
                            newLands = verticalLinearLimitPolygons(newLands,bisector.x,bisector.firstLeftBottom)
                        } else {
                            newLands = nonVerticalLinearLimitPolygons(newLands,bisector.a,bisector.b,bisector.firstLeftBottom)
                        }
                                                
                    } catch (e){ }
                }
                
//                console.log(newLands,merged1)
                var limit = this.WIDTH / this.CHUNKS_PER_SIDE
                
                try {
                    if(newLands.length > 0){
                        var newLands = triacontadigonalLimit(merged1.x,merged1.y,newLands,limit)
                        merged1.voronoi = newLands.right
                    } else {
                        merged1.voronoi = null
                    }
                } catch (e){ }
            }
        }
    }

    mergeVoronoisByShores(){
        var newMergedVoronois = []
        var groupedVoronois = {}
        for(var i in this.mergedVoronois){
            var voronoi = this.mergedVoronois[i]
            
            var teamColor = voronoi.team.color
            if(!(teamColor in groupedVoronois))
                groupedVoronois[teamColor] = []
                
            groupedVoronois[teamColor].push({voronoi:voronoi,bounds:multiPolygonBounds(voronoi.voronoi)})
        }
        for(var key in groupedVoronois){
            var group = groupedVoronois[key]
            
            var newGroups = []
            var unadded = new Set(group.map(a => a.voronoi))
            for(var i in this.shores){
                var newGroup = []
                
                var shore = this.shores[i].shore
                var shoreBounds = this.shores[i].bounds
                
                for(var ii in group){
                    var mergedVoronoi = group[ii].voronoi
                    var mergedVoronoiBounds = group[ii].bounds
                    
                    if(boundIntersection(shoreBounds, mergedVoronoiBounds) != null)
                        for(var j in shore){
                            var band = shore[j]
                            
                            if(polygonBordersBand(mergedVoronoi.voronoi[0],band)){
                                newGroup.push(mergedVoronoi)
                                unadded.delete(mergedVoronoi)
                                break
                            }
                        }
                }
                if(newGroup.length > 0)
                    newGroups.push(newGroup)
            }
            
            var i = 0
            while(i<newGroups.length){
                var s1 = new Set(newGroups[i])
                var j=i+1
                while(j<newGroups.length){
                    var s2 = new Set(newGroups[j])
                    
                    if(s1.intersection(s2).size > 0){
                        newGroups[i] = Array.from(new Set(newGroups[i].concat(newGroups[j])))
                        newGroups = newGroups.slice(0,j).concat(newGroups.slice(j+1))
                        continue
                    }
                    j++
                }
                i++
            }
            unadded.forEach(a=>newGroups.push([a]))
            //if(newGroups[0][0].team == this.playerChoosen)
            //    console.log(newGroups)
            for(var i in newGroups){
                var newGroup = newGroups[i]
                var first = newGroup[0]
                for(var j = 1;j<newGroup.length;j++){
                    var next = newGroup[j]
                    first.voronoi = Array.from(new Set(first.voronoi.concat(next.voronoi)))
                    first.units = Array.from(new Set(first.units.concat(next.units)))
                }
                newMergedVoronois.push(first)
            }
        }
        this.mergedVoronois = newMergedVoronois

    }

        }
        var firstCode = unitx+'#'+unity

        var pointDestinationStack = this.getVectorGraph(unit,[[x,y]],lands,port)
        var lastCode = x+'#'+y

        var path = []

            path.push(stackPoint.point)
            stackPoint = stackPoint.from
        }
        path = path.slice().reverse()
        
        if(path[0] == pointDestinationStack[firstCode].point)
            return path
        return null
    }

            }

                } else {
                    if(objectToBePressed instanceof Unit && objectToBePressed.towntaken != null)
                        objectToBePressed = objectToBePressed.towntaken
                    //unit.setPath(objectToBePressed.x,objectToBePressed.y,objectToBePressed)
                    unit.setLinePath(possiblePath.slice(1),objectToBePressed)
                }
            } else {
//                unit.setPath(x,y)

                unit.setLinePath(possiblePath.slice(1))
            }
        }
        if(possible && seaPossible && !unit.embarking){
            unit.embarking = true
            unit.embarkingProgress = 0
        }
        if(possible && seaPossible && possibleBarking != null){
            unit.barkingPoint = possibleBarking.barkingPoint
            unit.barkingLand = possibleBarking.land
        } else {
            unit.barkingPoint = null
            unit.barkingLand = null
        }

        var newUnit = null
        if(possible){
            newUnit = unit.leavePartOfUnit(selectedUnitDivision)
            if(newUnit != null){

                this.units.push(newUnit)
                this.updateChunkForUnit(newUnit)

        return {possible:possible, newUnit:newUnit}

    fightBetweenUnits(unit1,unit2){
        var unit1defenceFactor = 1
        var unit2defenceFactor = 1
        
        var STANDARD_HIT = 1
        
        if(unit1.towntaken != null)
            unit1defenceFactor *= 1.2
        if(unit2.towntaken != null)
            unit2defenceFactor *= 1.2
        
        var unit1attackingFloatBefore = unit1.attackingFloat
        var unit2attackingFloatBefore = unit2.attackingFloat
        
        unit1.attackingFloat += STANDARD_HIT / unit2defenceFactor
        unit2.attackingFloat += STANDARD_HIT / unit1defenceFactor
        
        unit1.size -= Math.floor(unit2.attackingFloat) - Math.floor(unit2attackingFloatBefore)
        unit2.size -= Math.floor(unit1.attackingFloat) - Math.floor(unit1attackingFloatBefore)
        
        if(unit1.size <= 0){
            unit1.size = 0
            unit1.die()
        }
        if(unit2.size <= 0){
            unit2.size = 0
            unit2.die()
        }
    }

                    this.updateChunkForUnit(unit)

                    var nopath = unit.path.length == 0
                    
                    chunkcode = unit.chunk.x+'#'+unit.chunk.y
                    var unitsToCheck = unitsByChunk[chunkcode]
                    for(var j in unitsToCheck){
                        var unit2 = unitsToCheck[j]
                        
                        if(unit.team != unit2.team && unit.tooClose(unit2)){
                            if((unit.size > 1 || unit.embarking) && !inTruceGraph(truceGraph,unit.team,unit2.team)){
                                this.fightBetweenUnits(unit,unit2)
                            } else {
                                unit.removePath()
                            }
                            pushback = true
                        }
                        if(unit.team == unit2.team && unit.towntaken == null){
                            if(/*unit.target != null && */(unit.target == null || unit.target == unit2 && !unit2.dead || unit.target.occupyingUnit != null && unit.target.occupyingUnit == unit2) && unit2.path.length == 0 && unit.tooClose(unit2) && unit.atPathEndAndInDirection(unit2)){
                                if(unit.target == null)
                                    unit.target = unit2
                                unit.tryToMergeWithTarget()
                                pushback = true
                                change = true
                            } else if(unit.size < 99 && nopath && unit.tooClose(unit2) && unit2.path.length == 0 && unit.atPathEndAndInDirection(unit2,true) && !unit2.dead){
                                unit.tryToMergeWithUnit(unit2)
                            }
                            if(unit.dead)
                                break
                            /*
                            if(unit2.towntaken == null && unit.target != unit2 && unit2.path.length == 0 && unit.tooClose(unit2) && unit.atPathEndAndInDirection(unit2)){
                                pushback = true
                                //change = false
                            }*/
                        }
                    }
                    
                    if(pushback){
                        unit.x = oldx
                        unit.y = oldy
                        this.updateChunkForUnit(unit)
                    } else {
                        if(unit.embarking)
                            unit.tryDisembark()
                        /*
                        var land = getPolygonInside(this.lands,unit.x,unit.y)
                        if(land != null){
                            unit.land = land
                            unit.embarking = false
                        } else {
                            unit.land = null
                            unit.embarking = true
                        }
                        change = true*/
                    }
                }
            } else {
                var code = unit.x+'#'+unit.y
                if(code in alreadyStaticUnits && !(!alreadyStaticUnits[code].towntaken && unit.towntaken) && !unit.dead){
                    unit.tryToMergeWithUnit(alreadyStaticUnits[code])
                } else {
                    alreadyStaticUnits[code] = unit
                }
            }
        }
        for(var i in this.towns){
            var town = this.towns[i]
            
//            if(town.occupyingUnit != null){
//                continue
//            }
                
            var chunkcode = town.chunk.x+'#'+town.chunk.y
            var unitsNearby = unitsByChunk[chunkcode]
            
            var oneTeam = true
            var team = null
            for(var j in unitsNearby){
                var unit = unitsNearby[j]
                
                if(unit.dead)
                    continue
                    
                if(unit.tooClose(town)){
                    if(town.occupyingUnit != null){
                        if(town.occupyingUnit != unit && town.occupyingUnit.team == unit.team && !town.occupyingUnit.dead && unit.path.length == 0){
//                            console.log('YYY')
                            unit.tryToMergeWithUnit(town.occupyingUnit)
                        }

                    } else {
                        if(oneTeam){
                            if(team == null){
                                team = unit.team
                            } else {
                                oneTeam = false
                            }
                        }
                    }
                    
                }
            }
            if(town.occupyingUnit == null && oneTeam && team != null){
                town.team = team
            }
        }
        
        for(var i in this.units){
            var unit1 = this.units[i]
                
            var chunkcode = unit1.chunk.x+'#'+unit1.chunk.y
            var unitsNearby = unitsByChunk[chunkcode]
            
            if(unit1.dead)
                continue
                
            var oneTeam = true
            var team = null
            for(var j in unitsNearby){
                var unit2 = unitsNearby[j]
                
                if(unit2.tooClose(unit1) && unit1 != unit2 && unit1.team == unit2.team && !unit2.dead){
                    if(unit1.path.length == 0 && unit2.path.length == 0 && !unit1.towntaken && !unit2.towntaken)
                        unit1.tryToMergeWithUnit(unit2)
                }
            }
        }
        var theresDead = false
        for(var i in this.units){
            if(this.units[i].dead)
                theresDead = true
        }
        if(theresDead)
            this.units = this.units.filter(a => !a.dead)
        //if(change)
            this.generateVoronois()

    updateChunkForUnit(unit){
        var newChunk = this.getChunkFromCoords(unit.x,unit.y)
        var newBigChunk = this.getBigChunkFromCoords(unit.x,unit.y)
        unit.setChunk(this.chunks[newChunk])
        unit.setBigChunk(this.bigChunks[newBigChunk])
    }
    wholeRealLandArea(teamStat){
        return teamStat.area/50 - teamStat.embarkedCount
    }
    realLandArea(voronoi,teamStat){
        return voronoi.landArea/50 - teamStat.embarkedCount * voronoi.unitCount / teamStat.unitCount
    }
    growUnits(){
        var change = false
        for(var i in this.towns){
            var town = this.towns[i]
            
            if(town.team != null && town.occupyingUnit == null){
                town.growingFloat += this.TOWN_GROWING_RATE
                if(town.growingFloat >= 1){
                    var newUnit = new Unit(town.x,town.y,Math.floor(town.growingFloat),town.team,town.land)
                    this.addUnitToTown(newUnit,town)
                    
                    change = true

                    town.growingFloat = 0
                }
            }
        }
        var unitsToGrowEvenMore = []
        var unitsToGrow = []
        var unitsToShrink = []
        for(var i in this.groupedMergedVoronois){
            var teamStat = this.groupedMergedVoronois[i]
            var embarkingBurden = teamStat.embarkedCount
            
            for(var j in teamStat.voronois){
                var voronoi = teamStat.voronois[j]
                if(voronoi.unitCount < this.realLandArea(voronoi,teamStat)/4){//voronoi.landArea/25 - teamStat.embarkedCount * voronoi.unitCount / teamStat.unitCount)
                    unitsToGrowEvenMore.push(voronoi.units)
                } else if(voronoi.unitCount < this.realLandArea(voronoi,teamStat)){//voronoi.landArea/25 - teamStat.embarkedCount * voronoi.unitCount / teamStat.unitCount)
                    unitsToGrow.push(voronoi.units)
                }
                if(voronoi.unitCount > this.realLandArea(voronoi,teamStat)){
                    unitsToShrink.push(voronoi.units)
                }
            }
        }
        unitsToGrowEvenMore = unitsToGrowEvenMore.flat()
        unitsToGrow = unitsToGrow.flat()
        unitsToShrink = unitsToShrink.flat()

    /*
        this.groupedMergedVoronois.push({
        team:team,
        voronois:magv,
        unitCount:this.units.filter(a => a.team == team).map(a=>a.size).reduce((a,b) => a+b,0),
        area:magv.map(a=>a.landArea).reduce((a,b) => a+b,0),
        embarkedCount:this.units.filter(a => a.team == team && a.embarked).map(a=>a.size).reduce((a,b) => a+b,0)
    */
            

        for(var i in unitsToGrowEvenMore){
            var unit = unitsToGrowEvenMore[i]
            if(unit.embarking)
                continue
                
            if(unit.growingFloat < 1)
                unit.growingFloat += 1
            var growingFloatBefore = unit.growingFloat
            if(unit.towntaken){
                unit.growingFloat += this.TOWN_GROWING_RATE*2
            } else {
                unit.growingFloat += this.COUNTRYSIDE_GROWING_RATE*2
            }
            unit.size = Math.min(99, unit.size + Math.floor(unit.growingFloat) - Math.floor(growingFloatBefore))
        }
        for(var i in unitsToGrow){
            var unit = unitsToGrow[i]
            if(unit.embarking)
                continue
                
            if(unit.growingFloat < 1)
                unit.growingFloat += 1
            var growingFloatBefore = unit.growingFloat
            if(unit.towntaken){
                unit.growingFloat += this.TOWN_GROWING_RATE
            } else {
                unit.growingFloat += this.COUNTRYSIDE_GROWING_RATE
            }
            unit.size = Math.min(99, unit.size + Math.floor(unit.growingFloat) - Math.floor(growingFloatBefore))
        }
        for(var i in unitsToShrink){
            var unit = unitsToShrink[i]
            if(unit.embarking)
                continue
                
            if(unit.growingFloat < 1)
                unit.growingFloat += 1
            var growingFloatBefore = unit.growingFloat
            unit.growingFloat -= this.UNIT_SHRINKING_RATE
            
            unit.size = Math.max(1,unit.size + Math.floor(unit.growingFloat) - Math.floor(growingFloatBefore))
        }
        //if(change){
        //    this.generateVoronois()
        //}

    }
    
    inQueue(queue,askingTeam,targetTeam,type){
        return queue.filter(a => a.type == type && a.from == askingTeam && a.to == targetTeam).length > 0
    }
    getRelation(askingTeam,targetTeam){
        var relations = this.diplomacyRelations.filter(a=>a.from == askingTeam && a.to == targetTeam && a.type == 'truce')
        if(relations.length > 0){
            return relations[0]
        }
        return null
    }
    askTruce(askingTeam,targetTeam){
        if(!this.inQueue(this.diplomacyQueue,askingTeam,targetTeam,'truce') && !this.inQueue(this.diplomacyRelations,askingTeam,targetTeam,'truce')){
            this.diplomacyQueue = this.diplomacyQueue.filter(a => a.from != askingTeam)
            this.diplomacyQueue.push({
                type:'truce',
                from:askingTeam,
                to:targetTeam,
                time:0
            })
        }
    }
    breakTruce(askingTeam,targetTeam){
        if(this.inQueue(this.diplomacyRelations,askingTeam,targetTeam,'truce')){
            var relation = this.getRelation(askingTeam, targetTeam)
            
            if(relation != null && relation.type == 'truce' && relation.time <= 0){
                this.diplomacyRelations = this.diplomacyRelations.filter(a => a.type != 'truce' || !(a.from == askingTeam && a.to == targetTeam) && !(a.to == askingTeam && a.from == targetTeam))
            }
        }
    }
    askToVassalize(askingTeam,targetTeam){
        if(!this.inQueue(this.diplomacyQueue,askingTeam,targetTeam,'ask-to-vassalize') && !this.inQueue(this.diplomacyRelations,askingTeam,targetTeam,'ask-to-vassalize')){
            this.diplomacyQueue = this.diplomacyQueue.filter(a => a.from != askingTeam)
            this.diplomacyQueue.push({
                type:'ask-to-vassalize',
                from:askingTeam,
                to:targetTeam,
                time:0
            })
        }
    }
    askForVassalization(askingTeam,targetTeam){
        if(!this.inQueue(this.diplomacyQueue,askingTeam,targetTeam,'ask-for-vassalization') && !this.inQueue(this.diplomacyRelations,askingTeam,targetTeam,'ask-for-vassalization')){
            this.diplomacyQueue = this.diplomacyQueue.filter(a => a.from != askingTeam)
            this.diplomacyQueue.push({
                type:'ask-for-vassalization',
                from:askingTeam,
                to:targetTeam,
                time:0
            })
        }
    }
    acceptDiplomacyQueueRequest(request,accept){
        this.diplomacyQueue = this.diplomacyQueue.filter(a => a != request)
        if(accept){
            switch(request.type){
                case 'truce':
                    this.diplomacyRelations.push({
                        type: 'truce',
                        from: request.from,
                        to: request.to,
                        time:this.DIPLOMACY_COOLDOWN,
                        areaUnderTruce:/*this.mergedVoronoisByChunk(request.to)//*/this.mergedVoronois.filter(a => a.team == request.to)
                    })
                    this.diplomacyRelations.push({
                        type: 'truce',
                        from: request.to,
                        to: request.from,
                        time:this.DIPLOMACY_COOLDOWN,
                        areaUnderTruce:/*this.mergedVoronoisByChunk(request.from)//*/this.mergedVoronois.filter(a => a.team == request.from)
                    })
                break
                case 'ask-to-vassalize':
                    this.diplomacyRelations.push({
                        type: 'vassal',
                        master: request.from,
                        vassal: request.to,
                        time:this.DIPLOMACY_COOLDOWN
                    })
                break
                case 'ask-for-vassalization':
                    this.diplomacyRelations.push({
                        type: 'vassal',
                        master: request.to,
                        vassal: request.from,
                        time:this.DIPLOMACY_COOLDOWN
                    })
                break
            }
        }
    }
    updateDiplomacy(){
        //console.log(this.diplomacyQueue)
        for(var i in this.diplomacyRelations){
            var dr = this.diplomacyRelations[i]
            
            if(dr.time > 0)
                dr.time--
        }
        var existingTeams = new Set(this.units.map(a => a.team).concat(this.towns.map(a => a.team)))
        this.diplomacyRelations = this.diplomacyRelations.filter(a => existingTeams.has(a.from) && existingTeams.has(a.to))
        this.diplomacyQueue = this.diplomacyQueue.filter(a => existingTeams.has(a.from) && existingTeams.has(a.to))
    }
}
const COLOR_LETTERS = '123456789ABCDE'
function getRandomColor() {
  var color = '#';
  for (var i = 0; i < 6; i++) {
    color += COLOR_LETTERS[Math.floor(Math.random() * COLOR_LETTERS.length)];
  }
  return color;
}
function darkColor(color){
    return !'BCDEF'.includes(color[1].toUpperCase()) && !'ABCDEF'.includes(color[3].toUpperCase()) && !'CDEF'.includes(color[5].toUpperCase())
}

    drawLand(land,strokeStyle,fillStyle){
        this.ctx.strokeStyle = strokeStyle
        this.ctx.fillStyle = fillStyle ? fillStyle : strokeStyle + '44'
        for(var i in land){
            this.ctx.beginPath()

            var band = land[i]
            for(var j in band){
                var point = band[j]
                if(j == 0){
                    this.ctx.moveTo(point[0],point[1])
                } else {
                    this.ctx.lineTo(point[0],point[1])
                }
            }
            this.ctx.closePath()
            
            this.ctx.stroke()
        }
        this.ctx.beginPath()
        for(var i in land){

            var band = land[i]
            for(var j in band){
                var point = band[j]
                if(j == 0){
                    this.ctx.moveTo(point[0],point[1])
                } else {
                    this.ctx.lineTo(point[0],point[1])
                }
            }
            
        }
        this.ctx.closePath()

    mouseOnTown(mouseCoords, town){
        var {WIDTH} = townData()
        
        return mouseCoords != null && mouseCoords.x > town.x-WIDTH*5/4 && mouseCoords.x < town.x+WIDTH*5/4 && mouseCoords.y > town.y-WIDTH*2 && mouseCoords.y < town.y
    }
    drawTowns(){
        var modelData = this.currentModelData()
        
        var WIDTH = 6
        
        var mouseCoords = this.modelMouseCoords()
        var focusedUnit = this.getUnitByMouse(mouseCoords)
        
        var focusedTown = focusedUnit == null ? this.getTownByMouse(mouseCoords) : null

        for(var i in modelData.towns){
            var town = modelData.towns[i]

            var focused = /*town.occupyingUnit != null && town.occupyingUnit == focusedUnit || */town == focusedTown
            
            this.ctx.strokeStyle = town.team ? '#000' : '#333'
            this.ctx.fillStyle = town.team ? town.team.color : '#ccc'
            
            if(focused)
                this.ctx.strokeStyle = this.GLOW_COLOR
            
            this.ctx.fillRect(town.x-WIDTH*5/4,town.y-WIDTH,WIDTH,WIDTH)
            this.ctx.strokeRect(town.x-WIDTH,town.y-WIDTH,WIDTH,WIDTH)
            
            this.ctx.fillRect(town.x+WIDTH/4,town.y-WIDTH*1.5,WIDTH,WIDTH*1.5)
            this.ctx.strokeRect(town.x+WIDTH/4,town.y-WIDTH*1.5,WIDTH,WIDTH*1.5)
            
            this.ctx.fillRect(town.x-WIDTH/2,town.y-WIDTH*2,WIDTH,WIDTH*2)
            this.ctx.strokeRect(town.x-WIDTH/2,town.y-WIDTH*2,WIDTH,WIDTH*2)
        }

    mouseOnUnit(mouseCoords, unit){
        var {WIDTH,HEIGHT,OFFSET,PADDING} = unitData()
        
        var realOffset = unit.towntaken ? OFFSET : 0
        
        return mouseCoords != null && mouseCoords.x > unit.x-WIDTH/2 && mouseCoords.x < unit.x+WIDTH/2 && mouseCoords.y > unit.y-HEIGHT/2-realOffset && mouseCoords.y < unit.y+HEIGHT/2-realOffset
    }
    getUnitByMouse(mouseCoords){
        var modelData = this.currentModelData()
        
        var {WIDTH,HEIGHT,OFFSET,PADDING} = unitData()
        
        var units = modelData.units.sort((a,b) => b.y - a.y)
        for(var i in units){
            var unit = units[i]
            if(!unitInProcessOfEmbarking(unit) && this.mouseOnUnit(mouseCoords, unit))
                return unit
        }
        return null
    }
    getTownByMouse(mouseCoords){
        var modelData = this.currentModelData()
        
        var {WIDTH,HEIGHT,OFFSET,PADDING} = unitData()
        
        var towns = modelData.towns.sort((a,b) => b.y - a.y)
        for(var i in towns){
            var town = towns[i]
            if(this.mouseOnTown(mouseCoords, town))
                return town
        }
        return null
    }
    drawUnits(){
        var modelData = this.currentModelData()
        
        var diplomacyQueue = modelData.diplomacyQueue.filter(a => a.from == modelData.playerChoosen)
        var diplomacyRelations = modelData.diplomacyRelations.filter(a => a.from == modelData.playerChoosen)
        
        var {WIDTH,HEIGHT,OFFSET,PADDING} = unitData()
        
        var mouseCoords = this.modelMouseCoords()
        
        var focusedUnit = this.getUnitByMouse(mouseCoords)
        var focusedTown = focusedUnit == null ? this.getTownByMouse(mouseCoords) : null

        var sortedUnits = modelData.units.filter(a => !unitInProcessOfEmbarking(a)).concat(modelData.units.filter(a => unitInProcessOfEmbarking(a)))
        //for(var i=0;i<this.model.units.length;i++){
        for(var i=sortedUnits.length - 1;i>=0;i--){
            var unit = sortedUnits[i]
            var teamColor = unit.team.color
            
            var selected = unit == modelData.selectedUnit
            var focused = unit == focusedUnit

            if(unit.path.length > 0){
                this.ctx.lineWidth = 2
                
                this.ctx.strokeStyle = '#f00'
                
                this.ctx.beginPath()
                this.ctx.moveTo(unit.x,unit.y)
                
                var point
                var lastPoint = [unit.x,unit.y]
                for(var j in unit.path){
                    point = unit.path[j]
                    this.ctx.lineTo(point[0],point[1])
                    if(j < unit.path.length - 1)
                        lastPoint = point
                }
                var ARROW_SIZE = 10
                var ARROW_ANGLE = Math.PI/8
                var angle = Math.atan2(lastPoint[1] - point[1], lastPoint[0] - point[0])
                this.ctx.lineTo(point[0],point[1])
                this.ctx.lineTo(point[0] + Math.cos(angle - ARROW_ANGLE)*ARROW_SIZE,point[1] + Math.sin(angle - ARROW_ANGLE)*ARROW_SIZE)
                this.ctx.lineTo(point[0],point[1])
                this.ctx.lineTo(point[0] + Math.cos(angle + ARROW_ANGLE)*ARROW_SIZE,point[1] + Math.sin(angle + ARROW_ANGLE)*ARROW_SIZE)
                this.ctx.stroke()
                
                this.ctx.lineWidth = 1
            }
            
            var asktruce = diplomacyQueue.filter(a => a.to == unit.team && a.type == 'truce').length > 0
            var truce = diplomacyRelations.filter(a => a.to == unit.team && a.type == 'truce').length > 0
            
            this.ctx.strokeStyle = focused ? this.GLOW_COLOR :'#000'
            this.ctx.fillStyle = teamColor
            
            if(focused || selected)
                this.ctx.lineWidth = 2
                
            if(focused)
                this.ctx.strokeStyle = this.GLOW_COLOR
            
            if(selected)
                this.ctx.strokeStyle = this.SELECTED_COLOR
                
            var realOffset = unit.towntaken ? OFFSET : 0
            
            
            var oldStrokeStyle = this.ctx.strokeStyle
            var oldFillStyle = this.ctx.fillStyle
            
            this.ctx.strokeStyle = oldStrokeStyle
            this.ctx.fillStyle = oldFillStyle
            
            this.ctx.fillRect(unit.x-WIDTH/2,unit.y-HEIGHT/2-realOffset,WIDTH,HEIGHT)
            this.ctx.strokeRect(unit.x-WIDTH/2,unit.y-HEIGHT/2-realOffset,WIDTH,HEIGHT)
            this.ctx.fillStyle = '#fff'
            if(asktruce){
                this.ctx.strokeStyle = '#aaa'
                drawPacifistSymbol(this.ctx,unit.x-WIDTH/2,unit.y-HEIGHT/2-realOffset,'?',0.6)
            }
            
            if(truce){
                this.ctx.strokeStyle = '#111'
                drawPacifistSymbol(this.ctx,unit.x-WIDTH/2,unit.y-HEIGHT/2-realOffset,'?',0.6)
            }
            this.ctx.strokeStyle = oldStrokeStyle
            this.ctx.fillStyle = oldFillStyle


            if(!selected && !focused)
                this.ctx.strokeStyle = darkColor(teamColor) ? '#fffa' : '#000'
            
            if(unit.size >= 10){
                var firstNumber = (''+unit.size)[0]
                var secondNumber = (''+unit.size)[1]
                    
                this.drawNumber(firstNumber , unit.x-WIDTH/2 + PADDING  ,unit.y-HEIGHT/2-realOffset + PADDING, WIDTH/2-PADDING*1.5,HEIGHT-PADDING*2)
                this.drawNumber(secondNumber, unit.x         + PADDING/2,unit.y-HEIGHT/2-realOffset + PADDING, WIDTH/2-PADDING*1.5,HEIGHT-PADDING*2)
            } else {                
                this.drawNumber(unit.size   , unit.x-WIDTH/8            ,unit.y-HEIGHT/2-realOffset + PADDING, WIDTH/2-PADDING*1.5,HEIGHT-PADDING*2)
            }
            if(selected && modelData.selectedUnitDivision != 1){
                
                var dividedSize = unit.sizeAfterDivision(modelData.selectedUnitDivision)
                
                var newerOffset = realOffset + 5
                this.ctx.fillRect(unit.x-WIDTH/2,unit.y-HEIGHT/2-newerOffset,WIDTH,HEIGHT)
                this.ctx.strokeRect(unit.x-WIDTH/2,unit.y-HEIGHT/2-newerOffset,WIDTH,HEIGHT)

                if(!selected && !focused)
                    this.ctx.strokeStyle = darkColor(teamColor) ? '#fffa' : '#000'
            
                if(dividedSize >= 10){
                    var firstNumber = (''+dividedSize)[0]
                    var secondNumber = (''+dividedSize)[1]
                        
                    this.drawNumber(firstNumber , unit.x-WIDTH/2 + PADDING  ,unit.y-HEIGHT/2-newerOffset + PADDING, WIDTH/2-PADDING*1.5,HEIGHT-PADDING*2)
                    this.drawNumber(secondNumber, unit.x         + PADDING/2,unit.y-HEIGHT/2-newerOffset + PADDING, WIDTH/2-PADDING*1.5,HEIGHT-PADDING*2)
                } else {                
                    this.drawNumber(dividedSize   , unit.x-WIDTH/8            ,unit.y-HEIGHT/2-newerOffset + PADDING, WIDTH/2-PADDING*1.5,HEIGHT-PADDING*2)
                }
                this.ctx.fillStyle = '#fff'
                if(asktruce){
                    this.ctx.strokeStyle = '#aaa'
                    drawPacifistSymbol(this.ctx,unit.x-WIDTH/2,unit.y-HEIGHT/2-newerOffset,'?',0.6)
                }
                
                if(truce){
                    this.ctx.strokeStyle = '#111'
                    drawPacifistSymbol(this.ctx,unit.x-WIDTH/2,unit.y-HEIGHT/2-newerOffset,'?',0.6)
                }
                this.ctx.strokeStyle = oldStrokeStyle
                this.ctx.fillStyle = oldFillStyle

            }
            if(unit.embarking && unit.embarkingProgress < unit.size){
                
                var newerOffset = OFFSET
                var noOffset = 0
                
                var unembarkedSize = unit.size - unit.embarkingProgress
                var embarkedSize = unit.embarkingProgress
                
                // UNEMBARKED
                this.ctx.fillRect(unit.x-WIDTH/2,unit.y-HEIGHT/2-newerOffset,WIDTH,HEIGHT)
                this.ctx.strokeRect(unit.x-WIDTH/2,unit.y-HEIGHT/2-newerOffset,WIDTH,HEIGHT)

                if(!selected && !focused)
                    this.ctx.strokeStyle = darkColor(teamColor) ? '#fffa' : '#000'
            
                if(unembarkedSize >= 10){
                    var firstNumber = (''+unembarkedSize)[0]
                    var secondNumber = (''+unembarkedSize)[1]
                        
                    this.drawNumber(firstNumber , unit.x-WIDTH/2 + PADDING  ,unit.y-HEIGHT/2-newerOffset + PADDING, WIDTH/2-PADDING*1.5,HEIGHT-PADDING*2)
                    this.drawNumber(secondNumber, unit.x         + PADDING/2,unit.y-HEIGHT/2-newerOffset + PADDING, WIDTH/2-PADDING*1.5,HEIGHT-PADDING*2)
                } else {                
                    this.drawNumber(unembarkedSize   , unit.x-WIDTH/8            ,unit.y-HEIGHT/2-newerOffset + PADDING, WIDTH/2-PADDING*1.5,HEIGHT-PADDING*2)
                }
                
                this.ctx.fillStyle = '#fff'
                if(asktruce){
                    this.ctx.strokeStyle = '#aaa'
                    drawPacifistSymbol(this.ctx,unit.x-WIDTH/2,unit.y-HEIGHT/2-noOffset,'?',0.6)
                }
                
                if(truce){
                    this.ctx.strokeStyle = '#111'
                    drawPacifistSymbol(this.ctx,unit.x-WIDTH/2,unit.y-HEIGHT/2-noOffset,'?',0.6)
                }
                this.ctx.strokeStyle = oldStrokeStyle
                this.ctx.fillStyle = oldFillStyle
                
                //EMBARKED
                this.ctx.fillRect(unit.x-WIDTH/2,unit.y-HEIGHT/2-noOffset,WIDTH,HEIGHT)
                this.ctx.strokeRect(unit.x-WIDTH/2,unit.y-HEIGHT/2-noOffset,WIDTH,HEIGHT)
                
                if(!selected && !focused)
                    this.ctx.strokeStyle = darkColor(teamColor) ? '#fffa' : '#000'
            
                if(embarkedSize >= 10){
                    var firstNumber = (''+embarkedSize)[0]
                    var secondNumber = (''+embarkedSize)[1]
                        
                    this.drawNumber(firstNumber , unit.x-WIDTH/2 + PADDING  ,unit.y-HEIGHT/2-noOffset + PADDING, WIDTH/2-PADDING*1.5,HEIGHT-PADDING*2)
                    this.drawNumber(secondNumber, unit.x         + PADDING/2,unit.y-HEIGHT/2-noOffset + PADDING, WIDTH/2-PADDING*1.5,HEIGHT-PADDING*2)
                } else {                
                    this.drawNumber(embarkedSize   , unit.x-WIDTH/8            ,unit.y-HEIGHT/2-noOffset + PADDING, WIDTH/2-PADDING*1.5,HEIGHT-PADDING*2)
                }
                
                this.ctx.fillStyle = '#fff'
                if(asktruce){
                    this.ctx.strokeStyle = '#aaa'
                    drawPacifistSymbol(this.ctx,unit.x-WIDTH/2,unit.y-HEIGHT/2-noOffset,'?',0.6)
                }
                
                if(truce){
                    this.ctx.strokeStyle = '#111'
                    drawPacifistSymbol(this.ctx,unit.x-WIDTH/2,unit.y-HEIGHT/2-noOffset,'?',0.6)
                }
                this.ctx.strokeStyle = oldStrokeStyle
                this.ctx.fillStyle = oldFillStyle

            }
            
//            this.ctx.strokeStyle = '#111'
//            drawPacifistSymbol(this.ctx,unit.x,unit.y,'?')
            this.ctx.lineWidth = 1
            
        }
    }
    drawNumber(num,x,y,w,h){
        var coords = vectorNumbers[num]
        this.ctx.beginPath()
        for(var i in coords){
            var point = coords[i]
            if(i == 0){
                this.ctx.moveTo(x+point[0]*w,y+point[1]*h)
            } else {
                this.ctx.lineTo(x+point[0]*w,y+point[1]*h)
            }
        }
        this.ctx.stroke()
    }
}

        return this.mouseCoords ? new Object({x:this.mouseCoords.x-PANEL_X-20,y:this.mouseCoords.y-20}) : null

    }

class HistoryState extends State {
    constructor(controller,previousState){
        super(controller,previousState)
        
        this.gameplay = true
        this.interaction = false
        this.history = true
        
        this.gameHistory = controller.gameHistory

        
        this.backgroundColor = this.controller.model.playerChoosen.color
        
        let t = this
        this.panelControls = [
            new TextControl(20,35,240,30,'HISTORY',this.borderColor()),
            this.timer = new TextControl(60,85,160,40,'0:00',this.borderColor()),

            new Button(30,590,220,40,'GO BACK',this.backgroundColor,this.borderColor(),()=>{t.controller.goToPreviousState()}),
            this.statisticsPanel = new StatisticsPanel(30,195,220,380,this.backgroundColor,this.borderColor(),()=>t.gameHistory.getCurrentModelData(),t)
        ]
        this.sliderHorizontalMargin = 60
        this.sliderBottomMargin = 60
        
        this.sliding = false
        
        this.sliderHeight = 40
        this.setTimer()
    }
    getSliderDimensions(){
        return {
            left: this.sliderHorizontalMargin,
            top: this.controller.model.WIDTH + 20 - this.sliderBottomMargin - this.sliderHeight,
            width: this.controller.model.WIDTH - this.sliderHorizontalMargin * 2,
            height: this.sliderHeight
        }
    }
    mouseCoordsTransformedToSlider(){
        var {left,top,width,height} = this.getSliderDimensions()
    
        var newCoords = this.mouseCoords ? new Object({x:(this.mouseCoords.x-20)/this.controller.model.ZOOM,y:(this.mouseCoords.y-20)/this.controller.model.ZOOM}) : null

        return newCoords && newCoords.x > left && newCoords.x < left + width && newCoords.y > top && newCoords.y < top + height ? newCoords : null
    }
    mouseDown(coords){
        super.mouseDown(coords)
        var mouseCoordsTransformedToSlider = this.mouseCoordsTransformedToSlider()
        
        if(mouseCoordsTransformedToSlider){
            this.sliding = true
            this.updateSlider(coords)
        }
    }
    mouseMove(coords){
        super.mouseMove(coords)
        if(this.sliding){
            this.updateSlider(coords)
        }
    }
    mouseUp(coords){
        super.mouseUp(coords)
        if(this.sliding){
            this.updateSlider(coords)
        }
        this.sliding = false
    }
    updateSlider(coords){
        var {left,top,width,height} = this.getSliderDimensions()

        var newTime = Math.max(0,Math.min(Math.round(((coords.x-this.controller.view.PADDING)/this.controller.model.ZOOM - left) / width * (this.gameHistory.states.length-1)),this.gameHistory.states.length-1))
        this.gameHistory.setCurrentTime(newTime)
        this.setTimer()
    }
    setTimer(){
        var time = Math.floor(this.gameHistory.currentTime/2)
        
        var minutes = Math.floor(time / 60)
        var seconds = String(time % 60).padStart(2,'0')
        
        var text = minutes + ':' + seconds
        
        this.timer.setText(text)
    }
}
